# FFmpeg builds bundled in the Synology packages, one entry per DSM architecture family.
# Read by fetch.sh; the choice and the measurements behind it are in README.md.
#
# Format: one entry per line, fields separated by blanks (no field contains a blank),
# lines starting with "#" and empty lines are ignored. Exactly one entry per family.
#
#   1  family          DSM "arch" family: x86_64, armv8 or armv7
#   2  status          selected = meets every criterion of ADR 0026 section 4;
#                      interim  = misses at least one criterion (README.md lists which); usable
#                                 for pipeline development and emulated tests, NOT for a release
#   3  version         provider's release label of the build (ffmpeg -version prints the
#                      FFmpeg version it is based on)
#   4  licence         SPDX identifier of the build's licence; the suffix "+nonfree" marks a
#                      build that links code FFmpeg classifies as non-free (the jellyfin GPL
#                      builds link libfdk-aac): under FFmpeg's own rules such a build is NOT
#                      redistributable, and fetch.sh says so in SOURCE.txt
#   5  archive_url     https URL of the binary archive (.tar.xz or .tar.gz), versioned so that
#                      it names exactly one build (the SHA-256 pins the content in any case)
#   6  archive_sha256  lowercase SHA-256 of that archive
#   7  archive_dir     directory inside the archive that holds ffmpeg and ffprobe ("." = root)
#   8  source_url      https URL of the corresponding source archive: FFmpeg source plus the
#                      provider's patches and build scripts, as far as the provider publishes
#                      them (README.md "Corresponding source")
#   9  source_sha256   lowercase SHA-256 of that archive
#  10  licence_files   comma-separated licence files installed next to the binaries, each
#                      "archive:<path>" (in the binary archive) or "source:<path>" (in the
#                      source archive), path relative to the archive root
#
# family status  version  licence           archive_url archive_sha256 archive_dir source_url source_sha256 licence_files
