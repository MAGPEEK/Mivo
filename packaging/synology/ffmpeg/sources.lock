# FFmpeg builds bundled in the Synology packages, one entry per DSM architecture family: the
# pins of the own static build made by the recipe in build/ (task SPK-15; the measurements
# behind the choice are in README.md). build.sh / build.ps1 compare what the recipe produced
# with these pins before packing (SPK-16), fetch.sh when it installs a build by hand.
#
# Format: one entry per line, fields separated by blanks (no field contains a blank),
# lines starting with "#" and empty lines are ignored. Exactly one entry per family.
#
#   1  family          DSM "arch" family: x86_64, armv8 or armv7 (also the recipe's target)
#   2  status          selected = meets every criterion of ADR 0026 section 4;
#                      interim  = misses at least one criterion (README.md lists which); usable
#                                 for pipeline development and emulated tests, NOT for a release
#   3  version         the build's version label, FFmpeg release plus the recipe revision
#                      (build/scripts/recipe.sh), as SOURCE.txt "Version:" and
#                      "ffmpeg -version" print it
#   4  licence         SPDX identifier of the build's licence; a suffix "+nonfree" would mark
#                      a build that links code FFmpeg classifies as non-free (such a build is
#                      NOT redistributable under FFmpeg's own rules; the recipe refuses one)
#   5  ffmpeg_sha256   lowercase SHA-256 of the ffmpeg executable the recipe produces
#   6  ffprobe_sha256  lowercase SHA-256 of the ffprobe executable
#
# The binaries are reproducible (build/README.md "Reproducibility"): a checksum that differs
# means the recipe or its inputs changed, so update the pins on purpose (README.md "Updating a
# pin"). The corresponding source archive (ffmpeg-<version>-source.tar) comes out of the same
# recipe build; its SHA-256 changes with every edit of the recipe directory and is recorded in
# each build's SOURCE.txt, not here.
#
# family status  version        licence          ffmpeg_sha256 ffprobe_sha256
