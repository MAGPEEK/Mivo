# oapi-codegen v2 configuration (ADR 0017). Run `go generate ./...` from the repository
# root after changing api/openapi.yaml and commit the regenerated apigen.gen.go.
# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: apigen
output: apigen.gen.go
generate:
  # Server interfaces and routing on net/http (Go 1.22+ ServeMux patterns).
  std-http-server: true
  # Typed request and response objects, so handlers cannot return undeclared responses.
  strict-server: true
  # Request and response types from components.schemas.
  models: true
compatibility:
  # Prefix enum constants with their type name (HealthStatusOk instead of Ok), so enums
  # added later never collide in the shared package namespace.
  always-prefix-enum-values: true
output-options:
  # The stream routes (tag "stream", ADR 0024) serve files with Range support and
  # long-lived writes, which the strict server cannot express. They are plain net/http
  # handlers in internal/adapters/http/stream, mounted on the REST API mux through
  # restapi.Options.Mounts. api/spec_test.go checks that this list equals the stream tag.
  exclude-operation-ids:
    - getPlaybackFile
    - headPlaybackFile
    - getPlaybackHlsFile
    - headPlaybackHlsFile
  type-mapping:
    string:
      formats:
        # Every uuid field and parameter uses the standard library uuid package, like
        # adapters/uuidgen, instead of the generator's openapi_types.UUID, so the code has
        # one UUID type. (github.com/google/uuid is still linked in transitively through
        # github.com/oapi-codegen/runtime; the mapping is about the types, not the module.)
        # JSON bodies use it through encoding.TextMarshaler. Path parameters are bound by
        # the oapi-codegen runtime, not encoding/json; the restapi test
        # TestUUIDPathParameterBinding proves that the runtime binds this type.
        uuid:
          type: uuid.UUID
          import: uuid
  # Go initialisms (ServerID, APIVersion) as in internal/domain instead of ServerId.
  name-normalizer: ToCamelCaseWithInitialisms
