# API contract of the server (ADR 0017). This file is the single source of truth: the Go
# server stubs (internal/adapters/http/apigen) and the TypeScript client
# (web/packages/api-client) are generated from it. Within /api/v1 only additive changes
# are allowed; breaking changes need a new API version.
openapi: 3.0.3
info:
  # Product name is a working title (ADR 0002); rename checklist item.
  title: Mivo API
  # Version of this document. Its major version equals SystemInfo.apiVersion and the /api/v1
  # path prefix; minor and patch versions track additive changes and fixes.
  version: "1.10.0"
  description: >-
    REST API of the media server. Paths carry the full version prefix. JSON fields use
    camelCase. Errors are RFC 9457 problem details with a machine-readable code. Within a
    major version changes are additive only: clients must ignore unknown fields and
    tolerate new enum values. Every request body is limited to 64 KiB; a larger body is
    rejected with 413 and the problem code "payload_too_large". While the server setting
    server.lan_only is on (the default), every request from a peer outside the local
    network is refused with 403 and the problem code "forbidden", except the health check.
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
  - url: /
tags:
  - name: system
    description: Server health and identity.
  - name: libraries
    description: >-
      Media libraries defined in the server configuration (ADR 0022) and their scans.
      Libraries are read-only through the API until accounts exist.
  - name: items
    description: >-
      Items of a library (movies, shows with their seasons and episodes, extras, music
      artists with their albums and tracks, audiobooks with their chapters, photo albums
      with their photos) with their local metadata, artwork references, files and
      technical streams (ADR 0027, ADR 0029).
  - name: playback
    description: >-
      Playback sessions: the server decides between direct play, remux and transcode for a
      client profile and returns an opaque stream URL (ADR 0023, ADR 0024).
  - name: stream
    description: >-
      Media delivery of a playback session. Clients never build these URLs; they use the
      streamUrl of the session and the relative URIs inside HLS playlists.
  - name: images
    description: >-
      Artwork (posters, backdrops, thumbnails, logos, banners) rendered in a fixed set of
      widths (ADR 0027). Clients build image URLs only through the api-client helper.
  - name: metadata
    description: >-
      Online metadata (ADR 0031): identify an item against TMDB or MusicBrainz, remove a
      match, refresh metadata and the provider settings and status. Operations that change
      data or settings are management operations (ADR 0028).
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Report whether the server can serve requests
      description: >-
        Runs the health checks (for example the database). Container orchestrators and
        clients use it as a readiness probe. The endpoint is unauthenticated. The overall
        status is "unavailable" if and only if the HTTP status is 503.
      tags:
        - system
      security: []
      responses:
        "200":
          description: The server and every checked component work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: At least one checked component is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Describe the running server
      description: >-
        Returns the product name, version and persistent server identity. Clients compare
        apiVersion before they use the API. The endpoint is unauthenticated.
      tags:
        - system
      security: []
      responses:
        "200":
          description: Information about the running server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries:
    get:
      operationId: listLibraries
      summary: List the configured libraries
      description: >-
        Returns every library of the server configuration with its availability, item count
        and the status of its current or last scan, ordered by name. Libraries come from the
        configuration file or the environment (importedFromConfig) or are managed through
        createLibrary, updateLibrary and deleteLibrary.
      tags:
        - libraries
      responses:
        "200":
          description: All libraries; an empty list when none exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createLibrary
      summary: Add a library
      description: >-
        Creates a library of one kind from 1 to 16 server folders chosen with the folder
        browser (listFolderRoots, listFolders). The folders must lie inside a folder root,
        must not overlap a folder of another library and must not be reserved (the data
        directory). Problem codes, with "field" naming the offending entry such as
        "folders[1]": "folder_not_found", "folder_unreadable", "folder_overlap" (409; the
        problem carries "libraryId" of the other library when there is one),
        "folder_reserved", "folder_outside_roots", "too_many_folders", "kind_unsupported",
        "name_invalid" and "language_invalid". A name that another library uses answers 409
        "conflict". Name length is 1 to 128 characters. The library is scanned after it is
        created.
      tags:
        - libraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryCreate"
      responses:
        "201":
          description: The new library.
          headers:
            Location:
              description: URL of the new library.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibrary
      summary: Describe one library
      description: >-
        Returns one library with its availability, item count and scan status. Clients poll
        it while a scan runs. An unknown ID answers 404 with the problem code "not_found".
      tags:
        - libraries
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateLibrary
      summary: Change a library
      description: >-
        Changes the name, folders, metadata language or options of a library; omitted
        properties stay as they are. The kind cannot change, and a body with kind answers
        400 "bad_request". "folders" replaces the whole ordered list: an entry with
        folderId keeps that folder of this library, an entry with rootId and path adds a
        folder. The problem codes of createLibrary apply. An unknown ID answers 404
        "not_found". The library is scanned again when its folders changed.
      tags:
        - libraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryUpdate"
      responses:
        "200":
          description: The changed library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteLibrary
      summary: Remove a library
      description: >-
        Removes the library and its catalog entries from the server. Media files on disk
        are never touched. An unknown ID answers 404 "not_found".
      tags:
        - libraries
      responses:
        "204":
          description: The library is removed.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/folder-roots:
    get:
      operationId: listFolderRoots
      summary: List the folder roots a library folder may be chosen from
      description: >-
        Returns the server folders the folder browser starts from, how the server is
        installed and the account it runs as, so the UI can explain permission problems.
      tags:
        - libraries
      responses:
        "200":
          description: The folder roots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderRootList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/folder-roots/{rootId}/folders:
    parameters:
      - $ref: "#/components/parameters/RootId"
    get:
      operationId: listFolders
      summary: List the sub-folders of a folder
      description: >-
        Returns the directories directly below path of a folder root; files are never
        listed. At most 1000 entries are returned (truncated says more exist). A bad path
        answers 400 "invalid"; a folder the server cannot read answers 400
        "folder_unreadable"; an unknown root or a missing folder answers 404 "not_found";
        a root that does not answer in time answers 503 "unavailable".
      tags:
        - libraries
      parameters:
        - name: path
          in: query
          required: false
          description: >-
            Folder to list, relative to the root and separated by "/", up to 4096
            characters. Empty or omitted lists the root itself.
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: The sub-folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: startLibraryScan
      summary: Start a scan of a library
      description: >-
        Starts a background scan of the library folder and returns at once. When a scan of
        this library already runs, no second one starts and its status is returned. Poll
        getLibrary for progress. An unknown ID answers 404 "not_found"; a server that is
        shutting down answers 503 "unavailable".
      tags:
        - libraries
      responses:
        "202":
          description: The scan runs; the body is its current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanStatus"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryItems
      summary: Page through the items of a library
      description: >-
        Returns one page of the library's top-level items (movies and shows; see the type
        parameter for the other library kinds and the photo timeline) in the order of
        sort and order (default: sort title ascending). Seasons and episodes are reached
        through listItemChildren; extras are never listed on their own, they belong to their
        parent's ItemDetail. The filters narrow the list: the values of one field filter
        combine with OR, different filters (and quick) combine with AND. Follow nextCursor
        until it is absent and repeat the same sort, order, seed and filters on every page;
        cursors stay opaque. totalCount counts the matching items across all pages. A limit
        outside 1–500, a cursor this server did not issue, or an unknown or malformed sort,
        order, type, quick or filter value answers 400 with the problem code "invalid" and
        field naming the parameter; an unknown library answers 404 "not_found". A server
        that cannot sort or filter yet answers 501 with the problem code "not_implemented"
        for any value other than the defaults.
      tags:
        - items
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of items in the page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque position from nextCursor of the previous page. Omit it for the first
            page. Clients must not parse or build it.
          schema:
            type: string
            maxLength: 2048
        - name: matchState
          in: query
          required: false
          description: >-
            Only items in this match state, for example "unmatched" for the "not matched"
            filter (ADR 0031). Omitted lists every item.
          schema:
            $ref: "#/components/schemas/MatchState"
        - name: sort
          in: query
          required: false
          description: >-
            Sort key; omitted sorts by title. Ties follow by sort title, then by ID, so the
            order is total and paging is stable. Items without a value for the key (no year,
            no rating) come last in both directions.
          schema:
            $ref: "#/components/schemas/ItemSort"
        - name: order
          in: query
          required: false
          description: Sort direction; omitted means ascending. Ignored for sort "random".
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: seed
          in: query
          required: false
          description: >-
            Seed of sort "random": the same seed and filter give the same order, so paging
            and returning to the list are stable. Omitted, the server picks a seed and keeps
            it in the cursor. Ignored for every other sort.
          schema:
            type: integer
            format: int32
            minimum: 0
        - $ref: "#/components/parameters/ItemTypeFilter"
        - $ref: "#/components/parameters/QuickFilter"
        - $ref: "#/components/parameters/GenreFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DecadeFilter"
        - $ref: "#/components/parameters/ContentRatingFilter"
        - $ref: "#/components/parameters/ResolutionFilter"
        - $ref: "#/components/parameters/VideoCodecFilter"
        - $ref: "#/components/parameters/AudioCodecFilter"
        - $ref: "#/components/parameters/ContainerFilter"
        - $ref: "#/components/parameters/AudioLanguageFilter"
        - $ref: "#/components/parameters/SubtitleLanguageFilter"
      responses:
        "200":
          description: One page of items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/facets:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryFacets
      summary: Count the filter values of a library's items
      description: >-
        Returns, per filter field, the values that occur among the library's top-level items
        (movies and shows; extras are never counted) with the number of items per value,
        for the filter menu. The count of a value applies the current filter with that
        field's own filter left out, so choosing a further value of the same field shows how
        far the list widens. An unknown field or a malformed filter value answers 400
        "invalid" with field naming the parameter; an unknown library answers 404
        "not_found". A server that cannot count yet answers 501 "not_implemented".
      tags:
        - items
      parameters:
        - name: field
          in: query
          required: false
          description: Fields to count; omitted counts every field.
          schema:
            type: array
            maxItems: 20
            items:
              $ref: "#/components/schemas/FacetField"
        - $ref: "#/components/parameters/ItemTypeFilter"
        - $ref: "#/components/parameters/QuickFilter"
        - $ref: "#/components/parameters/GenreFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DecadeFilter"
        - $ref: "#/components/parameters/ContentRatingFilter"
        - $ref: "#/components/parameters/ResolutionFilter"
        - $ref: "#/components/parameters/VideoCodecFilter"
        - $ref: "#/components/parameters/AudioCodecFilter"
        - $ref: "#/components/parameters/ContainerFilter"
        - $ref: "#/components/parameters/AudioLanguageFilter"
        - $ref: "#/components/parameters/SubtitleLanguageFilter"
      responses:
        "200":
          description: The values with their counts per field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacetList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/letters:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryLetters
      summary: Find where each first letter starts in the title-sorted list
      description: >-
        Returns, for the library's top-level items (movies and shows; extras are never
        listed) sorted by title in order and narrowed by the filters, the position of the
        first item of each first letter, so an A–Z bar can scroll a virtual grid. The
        filters mean the same as on listLibraryItems. An unknown order or a malformed filter
        value answers 400 "invalid" with field naming the parameter; an unknown library
        answers 404 "not_found". A server that cannot index yet answers 501
        "not_implemented".
      tags:
        - items
      parameters:
        - name: order
          in: query
          required: false
          description: Direction of the title sort; omitted means ascending.
          schema:
            $ref: "#/components/schemas/SortOrder"
        - $ref: "#/components/parameters/ItemTypeFilter"
        - $ref: "#/components/parameters/QuickFilter"
        - $ref: "#/components/parameters/GenreFilter"
        - $ref: "#/components/parameters/YearFilter"
        - $ref: "#/components/parameters/DecadeFilter"
        - $ref: "#/components/parameters/ContentRatingFilter"
        - $ref: "#/components/parameters/ResolutionFilter"
        - $ref: "#/components/parameters/VideoCodecFilter"
        - $ref: "#/components/parameters/AudioCodecFilter"
        - $ref: "#/components/parameters/ContainerFilter"
        - $ref: "#/components/parameters/AudioLanguageFilter"
        - $ref: "#/components/parameters/SubtitleLanguageFilter"
      responses:
        "200":
          description: The letters with their start positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LetterIndex"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/folders:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryFolders
      summary: Browse a library by its folders
      description: >-
        Returns one page of the children of a folder of the library: sub-folders first, then
        the catalog items found there, each group ordered by name. Paths are relative to the
        library and never absolute: the empty path lists the library's folders, whose path
        is their LibraryFolder.id; deeper paths append folder names separated by "/". A
        library with one folder therefore lists a single entry at the top; clients may open
        it right away. A path with a "." or ".." segment, an empty segment, a backslash or a
        leading "/" answers 400 "invalid" with field "path"; a limit outside 1–500 or a
        cursor this server did not issue answers 400 "invalid"; an unknown library or a
        missing folder answers 404 "not_found". A server that cannot browse folders yet
        answers 501 "not_implemented".
      tags:
        - items
      parameters:
        - name: path
          in: query
          required: false
          description: >-
            Folder to list, relative to the library and separated by "/", up to 4096
            characters: a LibraryFolder.id followed by folder names. Empty or omitted lists
            the library's folders.
          schema:
            type: string
            maxLength: 4096
        - name: limit
          in: query
          required: false
          description: Maximum number of entries in the page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque position from nextCursor of the previous page. Omit it for the first
            page. Clients must not parse or build it.
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: One page of the folder's children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFolderListing"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/rows:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryRows
      summary: Rows of a library's Overview pivot
      description: >-
        Returns the rows of the library's Overview pivot (LB-02, LB-03, LB-04, LB-09) with the
        first items of each, generated by the server (HO-07), in display order:
        "recentlyAdded", "newReleases", up to three "moreGenre" rows and, in a shows library,
        "recentEpisodes". Rows without items are left out. An empty library answers no rows
        and hint "noItems" (or "scanning" while its first scan runs). A limit outside 1–50
        answers 400 with the problem code "invalid" and field "limit"; an unknown library
        answers 404 "not_found". A server that cannot generate rows yet answers 501 with the
        problem code "not_implemented".
      tags:
        - items
      parameters:
        - $ref: "#/components/parameters/RowItemLimit"
      responses:
        "200":
          description: The library's Overview rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryRows"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/home/rows:
    get:
      operationId: getHomeRows
      summary: Rows and hero of the Home screen
      description: >-
        Returns the rows of the Home screen with the first items of each, generated by the
        server (HO-07), and the hero list (HO-01). The client renders the rows in the given
        order and does not compute them. Home carries only one "recentlyAdded" row per
        library, in the order of listLibraries ("recentEpisodes" stays on the library's
        Overview, listLibraryRows); rows without items are left out. Without libraries, or when no library has items yet, rows
        and hero are empty and hint says why. A limit outside 1–50 answers 400 with the
        problem code "invalid" and field "limit". A server that cannot generate rows yet
        answers 501 with the problem code "not_implemented".
      tags:
        - items
      parameters:
        - $ref: "#/components/parameters/RowItemLimit"
      responses:
        "200":
          description: The Home rows and the hero list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeRows"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{itemId}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItem
      summary: Describe one item with its metadata, files and streams
      description: >-
        Returns the item with its local metadata, artwork references, place in the
        hierarchy, extras, every media file and the technical streams of each file. An
        unknown ID answers 404 with the problem code "not_found".
      tags:
        - items
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{itemId}/children:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: listItemChildren
      summary: Page through the children of an item
      description: >-
        Returns one page of the item's children: the seasons of a show or the episodes of a
        season, the albums of an artist, the tracks of an album, or the sub-albums and photos
        of a photo album. Seasons ascend by number with the specials (season 0) last;
        episodes ascend by number, episodes without a number last by sort title. An artist
        lists its albums by sort title; an album lists its tracks by disc number, then track
        number, then file name (ItemSummary.discNumber and number). A photo album lists its
        sub-albums first (by sort title), then its photos by capture time (ItemPhoto.takenAt)
        and file name. Extras are never children; they belong to their parent's ItemDetail.
        order "desc" reverses the whole order; a photo album lists in this order only and
        answers order "desc" with 400 "invalid". Follow nextCursor until it is absent. A leaf
        item (movie, episode, extra, track, photo) answers an empty page. A limit outside
        1–500 or a cursor this server did not issue answers 400 "invalid"; an unknown item
        answers 404 "not_found".
      tags:
        - items
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of children in the page.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque position from nextCursor of the previous page. Omit it for the first
            page. Clients must not parse or build it.
          schema:
            type: string
            maxLength: 2048
        - name: order
          in: query
          required: false
          description: Sort direction of the children; omitted means ascending.
          schema:
            $ref: "#/components/schemas/SortOrder"
      responses:
        "200":
          description: One page of children.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{itemId}/identify/search:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: searchIdentifyCandidates
      summary: Search provider candidates to match an item with
      description: >-
        Searches the metadata providers for the item's kind by title and optional year, or
        looks up a pasted provider ID or URL (providerId), and returns the candidates best
        first. Management operation (ADR 0028): it is allowed for the administrator only
        once accounts exist. The search sends the query, year and metadata language to the
        provider and nothing else (ADR 0031). Candidate posters are Mivo URLs, so the
        browser never contacts a provider host. Problem codes: "not_found" (404, unknown
        item), "online_disabled" (409, online metadata is switched off), "invalid" (400)
        and "provider_unavailable" (503 with retryAfterSeconds and Retry-After).
      tags:
        - metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifySearchRequest"
      responses:
        "200":
          description: The candidates; an empty list when the provider knows none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentifyCandidateList"
        "409":
          $ref: "#/components/responses/OnlineDisabled"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{itemId}/identify:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: identifyItem
      summary: Match an item with a provider candidate
      description: >-
        Stores the provider and its ID for the item, locks the provider IDs, sets the match
        state to "matched" and queues the enrichment of the item (for a show also its
        seasons and episodes); other field locks stay. The answer is the item as it is at
        once, before the enrichment ran. Management operation (ADR 0028). Problem codes:
        "not_found" (404, unknown item), "invalid" (400, for example an ID that does not
        fit the item's kind), "online_disabled" (409) and "provider_unavailable" (503 with
        retryAfterSeconds and Retry-After).
      tags:
        - metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyRequest"
      responses:
        "200":
          description: The matched item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        "409":
          $ref: "#/components/responses/OnlineDisabled"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{itemId}/match:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    delete:
      operationId: removeItemMatch
      summary: Remove the online match of an item
      description: >-
        Drops the online data and the provider artwork of the item and sets its match state
        to "disabled", so no automatic match happens again until the item is identified.
        Local data (NFO, local artwork, user edits) stays. It works offline. Management
        operation (ADR 0028). An unknown item answers 404 "not_found".
      tags:
        - metadata
      responses:
        "200":
          description: The item without its match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/items/{itemId}/refresh:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: refreshItemMetadata
      summary: Queue a metadata refresh of an item
      description: >-
        Queues an online refresh of the item (and for a show its seasons and episodes) and
        returns at once; the result shows when the item is read again. Queuing works
        offline: the queue retries when the provider is reachable again. Management
        operation (ADR 0028). Problem codes: "not_found" (404, unknown item) and
        "online_disabled" (409).
      tags:
        - metadata
      responses:
        "202":
          description: The refresh is queued.
        "409":
          $ref: "#/components/responses/OnlineDisabled"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/libraries/{libraryId}/refresh:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: refreshLibraryMetadata
      summary: Queue a metadata refresh of a library
      description: >-
        Queues an online refresh of every item of the library whose match state is not
        "disabled" (matched and unmatched items) and returns at once. Queuing works
        offline: the queue retries when the provider is reachable again. Management
        operation (ADR 0028). Problem codes: "not_found" (404, unknown library) and
        "online_disabled" (409, also when online metadata is off for this library).
      tags:
        - metadata
      responses:
        "202":
          description: The refresh is queued.
        "409":
          $ref: "#/components/responses/OnlineDisabled"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/settings/metadata:
    get:
      operationId: getMetadataSettings
      summary: Read the online metadata settings
      description: >-
        Returns the global online switch, the metadata language and the state of each
        provider. API keys are never returned, only their status. Management operation
        (ADR 0028).
      tags:
        - metadata
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateMetadataSettings
      summary: Change the online metadata settings
      description: >-
        Changes the given settings; omitted properties stay as they are. The TMDB key is
        write-only: an empty string removes the own key. Management operation (ADR 0028).
        An empty language resets it to the server default (metadata.language of the
        configuration), as in updateLibrary. Problem codes: "language_invalid" (400 with
        field "language", a language that is no valid BCP 47 tag) and "invalid" (400 with
        field naming the entry, for example "providers[0]" for an unknown provider).
      tags:
        - metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataSettingsUpdate"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/metadata/status:
    get:
      operationId: getMetadataStatus
      summary: Report the state of the online metadata providers
      description: >-
        Returns the length of the enrichment queue and the state of each provider, so the UI
        can show "TMDB is busy, will retry" or offline.
      tags:
        - metadata
      responses:
        "200":
          description: The status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataStatus"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ImageId"
    get:
      operationId: getImage
      summary: Download an artwork image in a fixed width
      description: >-
        Serves the artwork image of an ImageRef rendered to the requested width, never
        upscaled: a narrower source is served at its own width. Logos are PNG to keep
        transparency, every other kind is JPEG. imageId may also be the ID of a photo item
        (ADR 0029): the photo is served as JPEG in its own aspect ratio with its EXIF
        orientation applied; the lightbox uses the same reference at a large width. A
        photo whose thumbnailState is "unsupported" answers 422 "unsupported". Every
        rendered image is re-encoded and carries no EXIF, GPS or XMP metadata of its
        source. The endpoint is unauthenticated for now (milestone 7 protects it by cookie
        or signed URL, ADR 0024). Clients build the URL only through the api-client helper
        imageUrl (or imageSrcSet) from an ImageRef and never take values out of it.
        Caching: a request whose tag equals the current tag of the image is answered with
        Cache-Control "private, max-age=31536000, immutable", any other request (no tag or
        an outdated one) with "private, no-cache". Both carry ETag "<tag>-<width>" and
        answer a matching If-None-Match with 304. Problem codes: "invalid" (400, a width
        outside ImageWidth or a malformed tag), "not_found" (404, an unknown image or a
        source file deleted from disk), "unsupported" (422, the source cannot be decoded)
        and "unavailable" (503, for example the library folder is unreachable or too many
        images are rendered at once).
      tags:
        - images
      security: []
      parameters:
        - name: width
          in: query
          required: true
          description: Width of the rendered image in pixels, one of the fixed set ImageWidth.
          schema:
            $ref: "#/components/schemas/ImageWidth"
        - name: tag
          in: query
          required: false
          description: >-
            Opaque version tag of the image (ImageRef.tag). With the current tag the
            response may be cached for a year; the api-client helper always sends it.
          schema:
            type: string
            maxLength: 64
            pattern: "^[0-9a-f]+$"
          example: 9f86d081884c7d65
      responses:
        "200":
          description: The rendered image.
          headers:
            ETag:
              $ref: "#/components/headers/ImageETag"
            Cache-Control:
              $ref: "#/components/headers/ImageCacheControl"
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/ImageBytes"
            image/png:
              schema:
                $ref: "#/components/schemas/ImageBytes"
        "304":
          description: The client's copy (If-None-Match) is current; no body is sent.
          headers:
            ETag:
              $ref: "#/components/headers/ImageETag"
            Cache-Control:
              $ref: "#/components/headers/ImageCacheControl"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/playback/sessions:
    post:
      operationId: createPlaybackSession
      summary: Start playing a media file
      description: >-
        Decides how the client plays the file (direct play, remux or transcode) from its
        profile and the server's capabilities, starts FFmpeg when needed and returns the
        session with an opaque streamUrl. Problem codes: "invalid" (400, for example a
        malformed profile), "forbidden" (403, only for a client outside the local network
        while server.lan_only is on), "not_found" (404, unknown file or a file deleted from
        disk), "unsupported" (422, the file cannot be played, for example because probing
        failed or its path now leads outside its library folder), "no_compatible_format"
        and "transcode_unavailable" (422), "session_limit_reached" (503 with Retry-After)
        and "unavailable" (503, for example the server is shutting down or the library
        folder is unreachable). Set replacesSessionId when seeking outside the produced
        range: the old session stops before the limit is checked.
      tags:
        - playback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackRequest"
      responses:
        "201":
          description: The session was created.
          headers:
            Location:
              description: >-
                URI reference of the new session resource. Resolve it per RFC 3986
                section 5 against the URL of the request that returned it.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        "503":
          description: >-
            The session limit is reached ("session_limit_reached") or a resource is
            unavailable ("unavailable", for example the server is shutting down or the
            library folder is unreachable). Retry-After accompanies session_limit_reached;
            it may be absent for unavailable.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/playback/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getPlaybackSession
      summary: Describe a playback session
      description: >-
        Returns the session with its current state. A session that was stopped or reaped
        after the idle timeout answers 404 "not_found"; the client then creates a new
        session at its current position.
      tags:
        - playback
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: stopPlaybackSession
      summary: Stop a playback session
      description: >-
        Stops the session, ends its FFmpeg process and removes its files. Idempotent: an
        unknown or already stopped session also answers 204.
      tags:
        - playback
      responses:
        "204":
          description: The session no longer runs.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/playback/sessions/{sessionId}/file:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getPlaybackFile
      summary: Download the original file of a direct-play session
      description: >-
        Serves the original media file of a session in mode direct_play with HTTP range
        support (Range, If-Range, 206, 416). The URL is unauthenticated and opaque: clients
        load streamUrl as it is and never build it. Content-Type follows the direct-play
        container (for example video/mp4 or video/webm). Sessions in another mode answer
        404 "not_found", a file deleted from disk 404, a file whose path now leads outside
        its library folder 422 "unsupported".
      tags:
        - stream
      security: []
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: The whole file.
          content:
            video/*:
              schema:
                $ref: "#/components/schemas/MediaBytes"
        "206":
          description: The requested byte range of the file.
          content:
            video/*:
              schema:
                $ref: "#/components/schemas/MediaBytes"
        "416":
          description: The requested range lies outside the file.
        default:
          $ref: "#/components/responses/Problem"
    head:
      operationId: headPlaybackFile
      summary: Describe the original file of a direct-play session
      description: >-
        Like getPlaybackFile without a body, so players can read the size and the range
        support. The URL is unauthenticated and opaque.
      tags:
        - stream
      security: []
      responses:
        "200":
          description: The headers of the whole file.
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/playback/sessions/{sessionId}/hls/{fileName}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
      - name: fileName
        in: path
        required: true
        description: >-
          A file of the session's HLS output: the playlist index.m3u8, the fMP4 init
          segment init.mp4 or a media segment seg-NNNNN.m4s. Any other name answers 404.
        schema:
          type: string
          pattern: "^(index\\.m3u8|init\\.mp4|seg-[0-9]{5}\\.m4s)$"
        example: index.m3u8
    get:
      operationId: getPlaybackHlsFile
      summary: Download a file of an HLS session
      description: >-
        Serves the playlist and segments of a session in mode remux or transcode. The URL is
        unauthenticated and opaque: clients load streamUrl and follow the relative
        URIs inside the playlist. Every file request, not only the playlist, waits up to 20
        seconds for the session's first segment, then answers 503 "stream_not_ready" with
        Retry-After; once the first segment exists it answers at once. Sessions in another
        mode answer 404 "not_found", a session whose FFmpeg failed answers 500 for every
        file. Every file supports HTTP range requests (Range, If-Range, 206, 416). The
        playlist is sent with Cache-Control no-store, init and media segments with private,
        max-age=3600.
      tags:
        - stream
      security: []
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: The requested playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                description: HLS playlist (EVENT type) with relative segment URIs.
            video/mp4:
              schema:
                $ref: "#/components/schemas/MediaBytes"
            video/iso.segment:
              schema:
                $ref: "#/components/schemas/MediaBytes"
        "206":
          description: The requested byte range of the playlist or segment.
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            video/mp4:
              schema:
                $ref: "#/components/schemas/MediaBytes"
            video/iso.segment:
              schema:
                $ref: "#/components/schemas/MediaBytes"
        "416":
          description: The requested range lies outside the file.
        "503":
          description: The first segment is not ready yet ("stream_not_ready").
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"
    head:
      operationId: headPlaybackHlsFile
      summary: Describe a file of an HLS session
      description: >-
        Like getPlaybackHlsFile without a body, including the wait for the first segment,
        so players can read the size and the range support. The URL is unauthenticated and
        opaque.
      tags:
        - stream
      security: []
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: The headers of the whole file.
        "206":
          description: The headers of the requested byte range.
        "416":
          description: The requested range lies outside the file.
        "503":
          description: >-
            The first segment is not ready yet ("stream_not_ready"); like for GET, the
            problem body is not sent.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      description: ID of the library.
      schema:
        type: string
        format: uuid
      example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
    RootId:
      name: rootId
      in: path
      required: true
      description: ID of the folder root (FolderRoot.id).
      schema:
        type: string
        format: uuid
      example: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
    ItemId:
      name: itemId
      in: path
      required: true
      description: ID of the item.
      schema:
        type: string
        format: uuid
      example: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
    SessionId:
      name: sessionId
      in: path
      required: true
      description: ID of the playback session (PlaybackSession.id).
      schema:
        type: string
        format: uuid
      example: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
    ImageId:
      name: imageId
      in: path
      required: true
      description: ID of the artwork image (ImageRef.id).
      schema:
        type: string
        format: uuid
      example: 7e6d5c4b-3a2f-4e1d-9c0b-a9f8e7d6c5b4
    ItemTypeFilter:
      name: type
      in: query
      required: false
      description: >-
        Kind of the items to list; it must be a top-level kind of the library ("movie" in a
        movies library, "show" in a shows library, "artist" or "album" in a music library,
        "audiobook" in an audiobooks library, "photo_album" or "photo" in a photos library),
        else 400 "invalid". Omitted uses the library's top-level kind ("artist" in a music
        library, "photo_album" in a photos library). In a photos library "photo" lists every
        photo of the library across all albums (the timeline, usually with sort "takenAt"
        and order "desc"), "photo_album" the top-level albums.
      schema:
        $ref: "#/components/schemas/ItemKind"
    QuickFilter:
      name: quick
      in: query
      required: false
      description: Quick filter of the toolbar; omitted or "all" filters nothing.
      schema:
        $ref: "#/components/schemas/ItemQuickFilter"
    GenreFilter:
      name: genre
      in: query
      required: false
      description: >-
        Only items with one of these genres (ItemDetail.genres, compared case-insensitively).
        Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 200
    YearFilter:
      name: year
      in: query
      required: false
      description: >-
        Only items released (movies) or first aired (shows) in one of these years. Repeat
        the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: integer
          format: int32
          minimum: 1000
          maximum: 9999
    DecadeFilter:
      name: decade
      in: query
      required: false
      description: >-
        Only items whose year lies in one of these decades, each given by its first year
        (1990 for 1990–1999); a year that is no multiple of 10 answers 400 "invalid".
        Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: integer
          format: int32
          minimum: 1000
          maximum: 9990
          multipleOf: 10
    ContentRatingFilter:
      name: contentRating
      in: query
      required: false
      description: >-
        Only items with one of these content ratings (ItemDetail.contentRating, exact
        text). Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 100
    ResolutionFilter:
      name: resolution
      in: query
      required: false
      description: >-
        Only items whose primary video falls into one of these resolution classes. Repeat
        the parameter for several values.
      schema:
        type: array
        maxItems: 10
        items:
          $ref: "#/components/schemas/VideoResolution"
    VideoCodecFilter:
      name: videoCodec
      in: query
      required: false
      description: >-
        Only items whose primary video stream uses one of these codecs (identifiers of
        ADR 0023, as in MediaSummary.videoCodec). Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 64
    AudioCodecFilter:
      name: audioCodec
      in: query
      required: false
      description: >-
        Only items with an audio stream in one of these codecs (identifiers of ADR 0023).
        Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 64
    ContainerFilter:
      name: container
      in: query
      required: false
      description: >-
        Only items whose primary file uses one of these containers (as in
        MediaSummary.container). Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 64
    AudioLanguageFilter:
      name: audioLanguage
      in: query
      required: false
      description: >-
        Only items with an audio stream in one of these languages (MediaStream.language,
        usually ISO 639-2). Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 35
    SubtitleLanguageFilter:
      name: subtitleLanguage
      in: query
      required: false
      description: >-
        Only items with a subtitle stream in one of these languages (MediaStream.language,
        usually ISO 639-2). Repeat the parameter for several values.
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          minLength: 1
          maxLength: 35
    RowItemLimit:
      name: limit
      in: query
      required: false
      description: >-
        Maximum number of items in each row (the row's first page); "See all" opens the
        Browse pivot for the rest.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
    Range:
      name: Range
      in: header
      required: false
      description: Byte range (RFC 9110), for example "bytes=0-1023".
      schema:
        type: string
  headers:
    RetryAfter:
      description: Seconds after which the client may retry the request.
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 5
    ImageETag:
      description: >-
        Validator of the rendered image, "<tag>-<width>" in quotes; send it back as
        If-None-Match.
      schema:
        type: string
      example: '"9f86d081884c7d65-320"'
    ImageCacheControl:
      description: >-
        "private, max-age=31536000, immutable" when the request carried the current tag,
        else "private, no-cache".
      schema:
        type: string
      example: private, max-age=31536000, immutable
  responses:
    Problem:
      description: The request failed; the body explains why.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OnlineDisabled:
      description: >-
        Online metadata is switched off globally or for the library ("online_disabled").
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ProviderUnavailable:
      description: >-
        The provider cannot be reached or is rate limiting ("provider_unavailable");
        retryAfterSeconds and Retry-After say when to try again.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    MatchState:
      type: string
      description: >-
        Whether the item is matched with an online provider: "matched", "unmatched" (no
        confident match yet) or "disabled" (the match was removed on purpose and is not made
        again automatically). Clients must tolerate new values.
      enum:
        - matched
        - unmatched
        - disabled
      example: matched
    MetadataSources:
      type: array
      description: >-
        Where the item's metadata came from, for example "nfo", "tmdb" or "musicbrainz";
        omitted when unknown. Clients must tolerate new values.
      maxItems: 16
      items:
        type: string
        maxLength: 32
        description: Name of one metadata source.
      example:
        - nfo
        - tmdb
    MetadataProvider:
      type: string
      description: >-
        An online metadata provider (ADR 0031). Clients must tolerate new values.
      enum:
        - tmdb
        - musicbrainz
        - coverartarchive
      example: tmdb
    ProviderKeyStatus:
      type: string
      description: >-
        Which API key a provider uses: "none" (no key, the provider is off), "bundled" (the
        key shipped with the build) or "own" (the key the user entered). Clients must
        tolerate new values.
      enum:
        - none
        - bundled
        - own
      example: bundled
    ProviderState:
      type: string
      description: >-
        Health of a provider: "ok", "rate_limited" (the provider asked to slow down, will
        retry), "offline" (not reachable, stale data is used) or "disabled" (switched off).
        Clients must tolerate new values.
      enum:
        - ok
        - rate_limited
        - offline
        - disabled
      example: ok
    IdentifySearchRequest:
      type: object
      description: >-
        What to search candidates for: a title query and optionally a year. With providerId,
        a provider ID or provider URL pasted by the user, the server looks that entry up
        instead of searching by title.
      additionalProperties: false
      required:
        - query
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 256
          description: Title to search for.
          example: Big Buck Bunny
        year:
          type: integer
          format: int32
          minimum: 1800
          maximum: 2200
          description: Release year to narrow the search.
          example: 2008
        providerId:
          type: string
          maxLength: 512
          description: >-
            Provider ID or provider URL pasted by the user, for example a TMDB movie URL.
            It is an ID in the namespace of the provider, not a Mivo ID.
          example: https://www.themoviedb.org/movie/10378
    IdentifyCandidate:
      type: object
      description: One provider entry the item may be matched with.
      required:
        - provider
        - externalId
        - title
        - confidence
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        externalId:
          type: string
          maxLength: 128
          description: >-
            ID of the entry at the provider, not a Mivo ID. Send it unchanged to identifyItem.
          example: "10378"
        title:
          type: string
          description: Title of the entry.
          example: Big Buck Bunny
        year:
          type: integer
          format: int32
          description: Release or first-air year of the entry.
          example: 2008
        overview:
          type: string
          description: Plot summary of the entry as plain text, shortened by the server.
          example: A giant rabbit takes revenge on three bullying rodents.
        posterUrl:
          type: string
          format: uri-reference
          maxLength: 512
          pattern: "^/api/v1/"
          description: >-
            Server URL of a poster preview, relative to the API origin. It never points at a
            provider host, so the browser contacts no third party (ADR 0010); omitted when
            the entry has no poster.
          example: /api/v1/images/7e6d5c4b-3a2f-4e1d-9c0b-a9f8e7d6c5b4?width=320
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: How well the entry fits the query, from 0 (not at all) to 1 (exact).
          example: 0.92
    IdentifyCandidateList:
      type: object
      description: Candidates of an identify search, best first.
      required:
        - candidates
      properties:
        candidates:
          type: array
          description: The candidates; at most 25.
          maxItems: 25
          items:
            $ref: "#/components/schemas/IdentifyCandidate"
    IdentifyRequest:
      type: object
      description: The candidate to match an item with.
      additionalProperties: false
      required:
        - provider
        - externalId
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        externalId:
          type: string
          minLength: 1
          maxLength: 128
          description: ID of the entry at the provider (IdentifyCandidate.externalId).
          example: "10378"
    MetadataProviderSetting:
      type: object
      description: Settings and key status of one provider.
      required:
        - provider
        - enabled
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        enabled:
          type: boolean
          description: Whether the provider may be contacted while online metadata is on.
          example: true
        keyStatus:
          $ref: "#/components/schemas/ProviderKeyStatus"
    MetadataSettings:
      type: object
      description: >-
        Online metadata settings (ADR 0031). Keys are never part of it.
      required:
        - onlineEnabled
        - language
        - providers
      properties:
        onlineEnabled:
          type: boolean
          description: Global switch; off means no connection to any provider.
          example: true
        language:
          type: string
          maxLength: 35
          description: Metadata language as a BCP 47 tag.
          example: de-DE
        providers:
          type: array
          description: One entry per provider.
          maxItems: 16
          items:
            $ref: "#/components/schemas/MetadataProviderSetting"
    MetadataProviderToggle:
      type: object
      description: Switches one provider on or off.
      additionalProperties: false
      required:
        - provider
        - enabled
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        enabled:
          type: boolean
          description: Whether the provider may be contacted.
          example: false
    MetadataSettingsUpdate:
      type: object
      description: >-
        Changes to the online metadata settings; omitted properties stay as they are.
      additionalProperties: false
      minProperties: 1
      properties:
        onlineEnabled:
          type: boolean
          description: Global switch; off means no connection to any provider.
          example: false
        language:
          type: string
          maxLength: 35
          description: >-
            Metadata language as a BCP 47 tag; an empty string resets it to the server
            default. A malformed tag answers 400 "language_invalid".
          example: en-US
        providers:
          type: array
          description: Providers to switch on or off; others stay as they are.
          maxItems: 16
          items:
            $ref: "#/components/schemas/MetadataProviderToggle"
        tmdbApiKey:
          type: string
          writeOnly: true
          maxLength: 128
          description: >-
            Own TMDB API key. It is never returned; an empty string removes it so the
            bundled key applies again.
    MetadataProviderStatus:
      type: object
      description: Current state of one provider.
      required:
        - provider
        - state
      properties:
        provider:
          $ref: "#/components/schemas/MetadataProvider"
        state:
          $ref: "#/components/schemas/ProviderState"
    MetadataStatus:
      type: object
      description: Queue length and provider states of the online metadata feature.
      required:
        - queueLength
        - providers
      properties:
        queueLength:
          type: integer
          format: int32
          minimum: 0
          description: Number of items waiting for enrichment.
          example: 12
        providers:
          type: array
          description: One entry per provider.
          maxItems: 16
          items:
            $ref: "#/components/schemas/MetadataProviderStatus"
    HealthStatus:
      type: string
      description: >-
        State of the server as a whole or of one health check. Clients must tolerate values
        added in later versions.
      enum:
        - ok
        - unavailable
    HealthCheck:
      type: object
      description: Result of checking one component.
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: >-
            Identifies the checked component, for example "database". The set of checks
            grows over time; clients must tolerate unknown names.
          example: database
        status:
          $ref: "#/components/schemas/HealthStatus"
        detail:
          type: string
          description: >-
            Explains a failure; omitted for passed checks. Fixed English text from a closed
            set; never contains raw error output, because the endpoint is unauthenticated.
            Not for display translation or parsing.
    HealthResponse:
      type: object
      description: Aggregated health of the server.
      required:
        - status
        - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        checks:
          type: array
          description: Individual check results in the order they were run.
          items:
            $ref: "#/components/schemas/HealthCheck"
    SystemInfo:
      type: object
      description: Describes the running server.
      required:
        - productName
        - version
        - serverId
        - apiVersion
        - libraryKinds
      properties:
        libraryKinds:
          type: array
          description: >-
            The library kinds this server accepts in createLibrary now; a subset of all
            kinds while a kind is not supported yet.
          items:
            $ref: "#/components/schemas/LibraryKind"
        productName:
          type: string
          description: Configurable product name of the server.
          example: Media Server
        version:
          type: string
          description: Release version of the server binary.
          example: 0.1.0
        commit:
          type: string
          description: VCS revision the binary was built from; omitted when unknown.
        buildTime:
          type: string
          format: date-time
          description: Commit time of the build; omitted when unknown.
        serverId:
          type: string
          format: uuid
          description: Persistent identity of this installation; stable across restarts.
        apiVersion:
          type: string
          description: >-
            Major version of the HTTP API this server speaks. It changes only on breaking
            changes.
          example: "1"
    LibraryKind:
      type: string
      description: >-
        What a library contains: "movies" (movie items), "shows" (show items with seasons
        and episodes), "music" (artist items with albums and tracks), "audiobooks"
        (audiobook items with chapters) or "photos" (photo albums following the folder tree
        with their photos, ADR 0029). Clients must tolerate values added in later versions.
        SystemInfo.libraryKinds lists the kinds a new library may have.
      enum:
        - movies
        - shows
        - music
        - audiobooks
        - photos
      example: movies
    LibraryList:
      type: object
      description: The configured libraries.
      required:
        - libraries
      properties:
        libraries:
          type: array
          description: Every configured library, ordered by name.
          items:
            $ref: "#/components/schemas/Library"
    Library:
      type: object
      description: A set of server folders with media files of one kind.
      required:
        - id
        - name
        - kind
        - available
        - itemCount
        - scan
        - folders
        - metadataLanguage
        - options
        - importedFromConfig
      properties:
        folders:
          type: array
          description: The folders of the library in their stored order; at least one.
          minItems: 1
          items:
            $ref: "#/components/schemas/LibraryFolder"
        metadataLanguage:
          type: string
          description: Language for metadata lookups (a BCP 47 tag); empty uses the server default.
          example: de
        options:
          $ref: "#/components/schemas/LibraryOptions"
        importedFromConfig:
          type: boolean
          description: >-
            Whether the library was created from the configuration file or environment
            rather than through the API.
          example: false
        id:
          type: string
          format: uuid
          description: Stable ID of the library; it stays the same when the library is edited.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        name:
          type: string
          description: Display name of the library.
          example: Movies
        kind:
          $ref: "#/components/schemas/LibraryKind"
        available:
          type: boolean
          description: >-
            Whether the library folder is reachable now. False for example while a network
            share is not mounted; its items stay listed but cannot be played.
          example: true
        itemCount:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of top-level items in the library (movies and shows), the items
            listLibraryItems returns; seasons, episodes and extras are not counted.
          example: 42
        scan:
          $ref: "#/components/schemas/ScanStatus"
    LibraryFolder:
      type: object
      description: One server folder of a library.
      required:
        - id
        - path
        - available
      properties:
        id:
          type: string
          format: uuid
          description: Stable ID of the folder; updateLibrary keeps a folder by this ID.
          example: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
        path:
          type: string
          description: Absolute path of the folder on the server, for display.
          example: /media/movies
        available:
          type: boolean
          description: Whether the folder is reachable now.
          example: true
    LibraryOptions:
      type: object
      description: Per-library switches for scanning and metadata.
      required:
        - scanExtras
        - readNfo
        - localArtwork
      properties:
        scanExtras:
          type: boolean
          description: Whether extras (trailers, featurettes) are scanned.
          example: true
        readNfo:
          type: boolean
          description: Whether NFO metadata files next to the media are read.
          example: true
        localArtwork:
          type: boolean
          description: Whether artwork files next to the media are used.
          example: true
        onlineMetadata:
          type: boolean
          description: >-
            Whether the items of this library are enriched from online metadata providers
            while the global switch is on (ADR 0031 section 2). Omitted means on. Responses
            always carry it; it is stored from task M6-03 on and reads as true until then.
          example: true
    FolderRef:
      type: object
      description: >-
        Names one folder of a library: either folderId (keep an existing folder of this
        library) or rootId with path (a folder below a folder root). The server rejects
        any other combination with the problem code "invalid".
      additionalProperties: false
      properties:
        folderId:
          type: string
          format: uuid
          description: ID of an existing folder of this library (LibraryFolder.id).
          example: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
        rootId:
          type: string
          format: uuid
          description: ID of the folder root that contains the folder (FolderRoot.id).
          example: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        path:
          type: string
          maxLength: 4096
          description: >-
            Folder relative to the root, separated by "/", up to 4096 characters; empty means
            the root itself.
          example: Movies/Animation
    LibraryCreate:
      type: object
      description: Request body of createLibrary.
      additionalProperties: false
      required:
        - kind
        - name
        - folders
      properties:
        kind:
          $ref: "#/components/schemas/LibraryKind"
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Display name, 1 to 128 characters.
          example: Movies
        folders:
          type: array
          description: The folders of the library, 1 to 16 entries; each names a root and path.
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/FolderRef"
        metadataLanguage:
          type: string
          description: Language for metadata lookups (a BCP 47 tag); omit for the server default.
          example: de
        options:
          $ref: "#/components/schemas/LibraryOptions"
    LibraryUpdate:
      type: object
      description: >-
        Request body of updateLibrary; at least one property. The kind of a library cannot
        change, so it is not part of this body.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: New display name, 1 to 128 characters.
          example: Movies
        folders:
          type: array
          description: The complete new ordered folder list, 1 to 16 entries.
          minItems: 1
          maxItems: 16
          items:
            $ref: "#/components/schemas/FolderRef"
        metadataLanguage:
          type: string
          description: New metadata language; an empty string selects the server default.
          example: de
        options:
          $ref: "#/components/schemas/LibraryOptions"
    InstallKind:
      type: string
      description: >-
        How the server is installed. Clients must tolerate values added in later versions.
      enum:
        - standard
        - docker
        - synology
      example: standard
    FolderRoot:
      type: object
      description: A server folder the folder browser may start from.
      required:
        - id
        - path
        - available
      properties:
        id:
          type: string
          format: uuid
          description: ID of the root; used in listFolders and FolderRef.rootId.
          example: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        path:
          type: string
          description: Absolute path of the root on the server, for display.
          example: /media
        available:
          type: boolean
          description: Whether the root is reachable now.
          example: true
    FolderRootList:
      type: object
      description: The folder roots with facts about the installation.
      required:
        - roots
        - installKind
        - serviceUser
      properties:
        roots:
          type: array
          description: The folder roots, in display order.
          items:
            $ref: "#/components/schemas/FolderRoot"
        installKind:
          $ref: "#/components/schemas/InstallKind"
        serviceUser:
          type: string
          description: Name of the account the server runs as; empty when unknown.
          example: mivo
    FolderReason:
      type: string
      description: >-
        Why a folder cannot be chosen: "reserved" (the server uses it) or "in_use" (another
        library holds it). Clients must tolerate values added in later versions.
      enum:
        - reserved
        - in_use
      example: in_use
    FolderEntry:
      type: object
      description: One sub-folder in a folder listing.
      required:
        - name
        - path
        - selectable
      properties:
        name:
          type: string
          description: Name of the folder.
          example: Animation
        path:
          type: string
          description: Path relative to the root, separated by "/"; pass it to listFolders.
          example: Movies/Animation
        selectable:
          type: boolean
          description: Whether the folder may be chosen for a library.
          example: true
        reason:
          $ref: "#/components/schemas/FolderReason"
    FolderListing:
      type: object
      description: The sub-folders of one folder of a root.
      required:
        - rootId
        - path
        - folders
        - unreadableCount
        - truncated
      properties:
        rootId:
          type: string
          format: uuid
          description: ID of the folder root.
          example: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        path:
          type: string
          description: The listed folder, relative to the root; empty for the root itself.
          example: Movies
        parentPath:
          type: string
          nullable: true
          description: The parent folder relative to the root; null when the root itself is listed.
          example: ""
        folders:
          type: array
          description: Sub-folders ordered by name; capped at 1000 entries.
          items:
            $ref: "#/components/schemas/FolderEntry"
        unreadableCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of entries left out because the server cannot read them.
          example: 0
        truncated:
          type: boolean
          description: Whether more than 1000 folders exist and the list is cut.
          example: false
    ScanState:
      type: string
      description: >-
        State of the current or last scan of a library: "idle" (no scan runs; the last one,
        if any, finished), "running" or "failed" (the last scan stopped early, see
        errorCode). Clients must tolerate values added in later versions.
      enum:
        - idle
        - running
        - failed
      example: idle
    ScanCounts:
      type: object
      description: >-
        File counts of the current or last scan. While a scan runs they grow; all are zero
        before the first scan.
      required:
        - added
        - updated
        - removed
        - unchanged
        - failed
        - skipped
      properties:
        added:
          type: integer
          format: int64
          minimum: 0
          description: New video files that were probed and added.
          example: 12
        updated:
          type: integer
          format: int64
          minimum: 0
          description: Changed video files that were probed again.
          example: 1
        removed:
          type: integer
          format: int64
          minimum: 0
          description: Files that disappeared and were removed.
          example: 0
        unchanged:
          type: integer
          format: int64
          minimum: 0
          description: Files whose size and modification time did not change.
          example: 29
        failed:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Files that could not be probed or resolved (for example a link that leaves the
            library folder); they are listed as unavailable.
          example: 0
        skipped:
          type: integer
          format: int64
          minimum: 0
          description: Files with a video extension but without a video stream.
          example: 0
    ScanStatus:
      type: object
      description: Progress and result of the current or last scan of a library.
      required:
        - state
        - counts
        - unavailableFolderCount
      properties:
        unavailableFolderCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of library folders that were not reachable during the scan.
          example: 0
        state:
          $ref: "#/components/schemas/ScanState"
        startedAt:
          type: string
          format: date-time
          description: Start of the current or last scan (UTC); omitted before the first scan.
          example: "2026-10-30T18:04:05Z"
        finishedAt:
          type: string
          format: date-time
          description: >-
            End of the last scan (UTC); omitted while a scan runs and before the first scan
            finished.
          example: "2026-10-30T18:04:31Z"
        counts:
          $ref: "#/components/schemas/ScanCounts"
        errorCode:
          type: string
          description: >-
            Machine-readable reason a scan failed; omitted unless state is "failed". Known
            codes: "root_unavailable" (the library folder is missing or unreadable),
            "prober_unavailable" (the probing tool cannot run), "catalog_failed" (the
            catalog could not be read or written), "scan_canceled" (the server shut down
            during the scan) and "scan_failed" (any other reason). New codes may be added;
            clients translate the known codes and show a generic text for unknown ones.
          example: root_unavailable
    HdrFormat:
      type: string
      description: >-
        High dynamic range format of a video stream; absent for SDR video. Clients must
        tolerate values added in later versions (for example Dolby Vision).
      enum:
        - hdr10
        - hlg
      example: hdr10
    MediaSummary:
      type: object
      description: >-
        Technical summary of an item's primary file for list views ("MKV · H.264 · AAC");
        only durationSeconds of an audiobook covers all its part files. Codec and container
        identifiers follow ADR 0023.
      required:
        - available
      properties:
        available:
          type: boolean
          description: >-
            Whether the file was probed successfully and can be played. False when probing
            failed; the item is listed but cannot be played.
          example: true
        container:
          type: string
          description: Container short name, for example "mkv"; omitted when unknown.
          example: mkv
        durationSeconds:
          type: number
          format: double
          minimum: 0
          description: >-
            Duration in seconds with millisecond precision; for an audiobook of several part
            files the sum of its parts. Omitted when unknown.
          example: 5423.042
        videoCodec:
          type: string
          description: Codec of the primary video stream (ffprobe codec_name).
          example: h264
        audioCodec:
          type: string
          description: Codec of the default audio stream; omitted for files without audio.
          example: aac
        width:
          type: integer
          format: int32
          minimum: 0
          description: Width of the primary video stream in pixels.
          example: 1920
        height:
          type: integer
          format: int32
          minimum: 0
          description: Height of the primary video stream in pixels.
          example: 1080
        bitDepth:
          type: integer
          format: int32
          minimum: 0
          description: Bit depth of the primary video stream.
          example: 8
        hdr:
          $ref: "#/components/schemas/HdrFormat"
    ItemKind:
      type: string
      description: >-
        Kind of an item (ADR 0027): "movie" and "show" are top-level items, a "season"
        belongs to a show, an "episode" to a season, an "extra" (trailer, featurette, …) to
        a movie or a show. In a music library an "artist" is the top-level item, an "album"
        belongs to an artist and a "track" to an album. In an audiobooks library an
        "audiobook" is the top-level item; its chapters are not items but listed in
        ItemDetail.chapters. In a photos library every folder is a "photo_album" (nested
        like the folder tree, a top-level album belongs to no parent) and every image or
        short video is a "photo" in its folder's album or, in the library root, top-level
        (ADR 0029). Movies, episodes, extras, tracks, audiobooks and photos own media files;
        shows, seasons, artists, albums and photo albums are containers without files.
        Clients must tolerate values added in later versions.
      enum:
        - movie
        - show
        - season
        - episode
        - extra
        - artist
        - album
        - track
        - audiobook
        - photo_album
        - photo
      example: movie
    ExtraType:
      type: string
      description: >-
        What an extra contains, from its folder or file name suffix (ADR 0027). Clients
        must tolerate values added in later versions.
      enum:
        - trailer
        - featurette
        - behind_the_scenes
        - deleted_scene
        - interview
        - scene
        - short
        - other
      example: trailer
    ArtworkKind:
      type: string
      description: >-
        Kind of an artwork image: "poster" (portrait), "backdrop" (wide background),
        "thumb" (16:9 episode still or movie landscape), "logo" (transparent title logo),
        "banner" or "square" (1:1 album cover or artist image, rendered in the same
        ImageWidth set as posters). An audiobook cover is a "poster" (2:3). A photo and a
        photo album use the "square" slot for their 1:1 tile; the referenced image is the
        photo itself in its own aspect ratio, which the client crops to the tile. Clients
        must tolerate values added in later versions.
      enum:
        - poster
        - backdrop
        - thumb
        - logo
        - banner
        - square
      example: poster
    PersonRole:
      type: string
      description: >-
        Role of a person in an item; "author" and "narrator" describe audiobooks. Clients
        must tolerate values added in later versions.
      enum:
        - actor
        - director
        - writer
        - producer
        - guest_star
        - author
        - narrator
      example: actor
    SortOrder:
      type: string
      description: >-
        Sort direction: "asc" (ascending) or "desc" (descending). Clients must tolerate
        values added in later versions.
      enum:
        - asc
        - desc
      default: asc
      example: asc
    ImageWidth:
      type: integer
      format: int32
      description: >-
        Width in pixels an image is rendered to; any other width is rejected. Pick the
        smallest width at least as wide as the displayed size times the device pixel ratio.
        Clients must tolerate values added in later versions.
      enum:
        - 160
        - 320
        - 480
        - 640
        - 960
        - 1280
        - 1920
      example: 320
    ImageRef:
      type: object
      description: >-
        Reference to an artwork image or to a photo (ADR 0029). Clients pass it to the
        api-client helper imageUrl, which builds the getImage URL; they never build that URL
        themselves.
      required:
        - id
        - tag
      properties:
        id:
          type: string
          format: uuid
          description: >-
            ID of the image (getImage imageId); for a photo the ID of the photo item.
          example: 7e6d5c4b-3a2f-4e1d-9c0b-a9f8e7d6c5b4
        tag:
          type: string
          maxLength: 64
          description: >-
            Opaque version tag; it changes when the image changes. Clients must not parse
            or compare it, only pass it on through the helper.
          example: 9f86d081884c7d65
    Artwork:
      type: object
      description: >-
        The selected artwork of an item, one image per ArtworkKind; a kind without an image
        is omitted. A season without its own poster carries its show's poster.
      properties:
        poster:
          $ref: "#/components/schemas/ImageRef"
        backdrop:
          $ref: "#/components/schemas/ImageRef"
        thumb:
          $ref: "#/components/schemas/ImageRef"
        logo:
          $ref: "#/components/schemas/ImageRef"
        banner:
          $ref: "#/components/schemas/ImageRef"
        square:
          $ref: "#/components/schemas/ImageRef"
    ProviderIds:
      type: object
      description: >-
        IDs of the item at external metadata providers, read from local NFO files. No
        connection to a provider is made (ADR 0010). Absent IDs are omitted.
      properties:
        tmdb:
          type: string
          description: The Movie Database ID (digits).
          example: "10378"
        imdb:
          type: string
          description: IMDb ID ("tt" followed by digits).
          example: tt1254207
        tvdb:
          type: string
          description: TheTVDB ID (digits).
          example: "81189"
    ItemPerson:
      type: object
      description: A person credited on an item.
      required:
        - name
        - role
      properties:
        name:
          type: string
          description: Name of the person as stored in the metadata.
          example: Sacha Goedegebure
        role:
          $ref: "#/components/schemas/PersonRole"
        character:
          type: string
          description: Character an actor or guest star plays; omitted when unknown.
          example: Bunny
    ItemAncestor:
      type: object
      description: An item above another one in the hierarchy, for breadcrumbs.
      required:
        - id
        - kind
        - title
      properties:
        id:
          type: string
          format: uuid
          description: ID of the ancestor item.
          example: 4b5c6d7e-8f9a-4b0c-9d1e-2f3a4b5c6d7e
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Display title of the ancestor.
          example: Breaking Bad
        number:
          type: integer
          format: int32
          minimum: 0
          description: Season number of a season ancestor (0 for specials); omitted otherwise.
          example: 1
    ItemSummary:
      type: object
      description: >-
        An item in a library listing or in a list of children. Fields that do not apply to
        the item's kind, or that are unknown, are omitted. poster is the poster of a movie,
        show or season (a season without its own carries its show's poster) or the 2:3 cover
        of an audiobook; an episode card of a "recentEpisodes" row carries its show's poster;
        thumb is the still of an episode or extra (without one the client
        shows a placeholder); square is the cover of an album or the image of an artist,
        the 1:1 tile of a photo (the photo itself, ImageRef.id is the photo's item ID) or
        of a photo album (its newest photo whose thumbnailState is "ready"; omitted when it
        has none). A photo whose thumbnailState is "unsupported" has no square; the client
        shows a placeholder. media summarises the primary file and is omitted for
        containers (show, season, artist, album, photo album); for an audiobook of several
        part files durationSeconds is the sum of its parts. A photo carries media only when
        it is a video (durationSeconds gives the duration badge of its tile); a still photo
        has no media, so media-based filters such as quick "unavailable" never match it.
      required:
        - id
        - libraryId
        - kind
        - title
      properties:
        id:
          type: string
          format: uuid
          description: ID of the item.
          example: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
        libraryId:
          type: string
          format: uuid
          description: ID of the library that contains the item.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Display title from local metadata (NFO) or else the file or folder name.
          example: Big Buck Bunny
        year:
          type: integer
          format: int32
          description: >-
            Release year of a movie or an album, publication year of an audiobook or
            first-air year of a show.
          example: 2008
        parentId:
          type: string
          format: uuid
          description: >-
            ID of the parent item: the show of a season, the season of an episode, the movie
            or show of an extra, the artist of an album, the album of a track, the photo
            album of a photo or of a nested photo album; omitted for top-level items.
          example: 4b5c6d7e-8f9a-4b0c-9d1e-2f3a4b5c6d7e
        takenAt:
          type: string
          format: date-time
          description: >-
            Capture time of a photo, as in ItemPhoto.takenAt; the timeline groups photos by
            its month and day. Omitted for other kinds.
          example: "2026-10-12T14:35:08Z"
        thumbnailState:
          $ref: "#/components/schemas/ThumbnailState"
        number:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Season number of a season (0 for specials), episode number of an episode or
            track number of a track on its disc.
          example: 1
        numberEnd:
          type: integer
          format: int32
          minimum: 0
          description: Last episode number of a file that holds several episodes (S01E01-E02).
          example: 2
        discNumber:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Disc number of a track on its album, from the disc tag (ADR 0027); omitted when
            unknown and for other kinds.
          example: 2
        absoluteNumber:
          type: integer
          format: int32
          minimum: 0
          description: Absolute episode number of an episode named by a bare number (Show - 130).
          example: 130
        extraType:
          $ref: "#/components/schemas/ExtraType"
        childCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Number of seasons of a show, of episodes of a season, of albums of an artist, of
            tracks of an album or of the direct children (sub-albums and photos) of a photo
            album.
          example: 5
        leafCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Number of episodes of a show across all its seasons, of tracks of an artist
            across all its albums or of photos of a photo album including its sub-albums
            (the "n photos" line of an album card).
          example: 62
        poster:
          $ref: "#/components/schemas/ImageRef"
        thumb:
          $ref: "#/components/schemas/ImageRef"
        square:
          $ref: "#/components/schemas/ImageRef"
        media:
          $ref: "#/components/schemas/MediaSummary"
        matchState:
          $ref: "#/components/schemas/MatchState"
        metadataSources:
          $ref: "#/components/schemas/MetadataSources"
        seasonNumber:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Season number of an episode (0 for specials), for the compact "S3 · E7" label.
            Rows carry it; listItemChildren of a season may omit it, the parent already
            names the season.
          example: 3
        showTitle:
          type: string
          maxLength: 500
          description: >-
            Title of the show of a season or an episode, so a card can name it. Rows carry
            it; listItemChildren may omit it, the parent already names the show.
          example: Elephants Dream
        newEpisodeCount:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Only in rows of kind "recentlyAdded": the number of recently added episodes this
            show or season card groups (HO-05, the "new episodes" badge). Omitted elsewhere.
          example: 3
    ItemPage:
      type: object
      description: One page of items.
      required:
        - items
      properties:
        items:
          type: array
          description: >-
            The items of this page, in the order of the operation (sort title for library
            listings, number for children).
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          maxLength: 2048
          description: >-
            Opaque cursor for the next page; omitted on the last page. Pass it unchanged as
            the cursor query parameter.
          example: eyJ0IjoiYmlnIGJ1Y2sgYnVubnkifQ
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Number of items a library listing matches across all pages, for the result count
            and the height of a virtual grid. Omitted by listItemChildren and by a server
            that cannot count the listing yet.
          example: 42
    ItemSort:
      type: string
      description: >-
        Sort key of a library listing: "title" (sort title), "year", "releaseDate" (release
        of a movie, first air date of a show), "contentRating" (rating text), "duration"
        (of the primary file; for an audiobook the sum of its parts), "dateAdded" (when the
        item entered the catalog), "resolution" (pixel count of the primary video),
        "bitrate" (overall bit rate of the primary file), "fileSize" (primary file; for a
        show the sum of its episodes), "takenAt" (capture time of a photo, ties by file
        name; for a photo album the capture time of its newest photo) or "random" (shuffled,
        stable per seed). Containers without a file (shows) have no duration, resolution or
        bit rate. Clients must tolerate values added in later versions.
      enum:
        - title
        - year
        - releaseDate
        - contentRating
        - duration
        - dateAdded
        - resolution
        - bitrate
        - fileSize
        - takenAt
        - random
      default: title
      example: dateAdded
    ItemQuickFilter:
      type: string
      description: >-
        Quick filter of a library listing: "all" (no filter), "hdr" (any HDR format of the
        primary video, Dolby Vision included), "dolbyVision", "hdr10plus", "atmos" (a Dolby
        Atmos audio stream), "uhd" (resolution class 4k or 8k), "unavailable" (the primary
        file cannot be played, MediaSummary.available false, or its folder is offline) or
        "duplicates" (items with more than one media file). For a show the episodes decide:
        it matches when one of its episodes matches. Clients must tolerate values added in
        later versions.
      enum:
        - all
        - hdr
        - dolbyVision
        - hdr10plus
        - atmos
        - uhd
        - unavailable
        - duplicates
      default: all
      example: hdr
    VideoResolution:
      type: string
      description: >-
        Resolution class of a video, decided by width or height so cropped and portrait
        video land in the expected class: "8k" (width ≥ 7000 or height ≥ 4000), "4k"
        (≥ 3200 or ≥ 1800), "1080p" (≥ 1600 or ≥ 900), "720p" (≥ 1100 or ≥ 650), else
        "sd". Clients must tolerate values added in later versions.
      enum:
        - sd
        - 720p
        - 1080p
        - 4k
        - 8k
      example: 1080p
    FacetField:
      type: string
      description: >-
        A filter field that facet counts are given for; each value names the
        listLibraryItems parameter of the same name. Clients must tolerate values added in
        later versions.
      enum:
        - genre
        - year
        - decade
        - contentRating
        - resolution
        - videoCodec
        - audioCodec
        - container
        - audioLanguage
        - subtitleLanguage
      example: genre
    FacetValue:
      type: object
      description: One value of a filter field with the number of items that carry it.
      required:
        - value
        - count
      properties:
        value:
          type: string
          description: >-
            The value as it is sent back in the filter parameter, for example "Drama",
            "2008", "1990" (a decade) or "1080p".
          example: Drama
        count:
          type: integer
          format: int64
          minimum: 0
          description: Number of top-level items with this value under the current filter.
          example: 12
    Facet:
      type: object
      description: The values of one filter field.
      required:
        - field
        - values
        - truncated
      properties:
        field:
          $ref: "#/components/schemas/FacetField"
        values:
          type: array
          description: >-
            Values ordered by value (numbers numerically, text case-insensitively); values
            with a count of 0 are left out. Capped at 500 entries.
          maxItems: 500
          items:
            $ref: "#/components/schemas/FacetValue"
        truncated:
          type: boolean
          description: Whether more than 500 values exist and the list is cut.
          example: false
    FacetList:
      type: object
      description: Facet counts of a library listing, one entry per requested field.
      required:
        - facets
      properties:
        facets:
          type: array
          description: The requested fields in the order of FacetField.
          items:
            $ref: "#/components/schemas/Facet"
    LetterOffset:
      type: object
      description: Where the items of one first letter start in the title-sorted list.
      required:
        - letter
        - offset
      properties:
        letter:
          type: string
          minLength: 1
          maxLength: 1
          description: >-
            "A" to "Z" for sort titles that start with that letter, accents folded ("Ä" is
            "A"), or "#" for every other first character (digits, symbols, other scripts).
          example: B
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Zero-based position of the letter's first item in the sorted, filtered list.
          example: 17
    LetterIndex:
      type: object
      description: The start positions of the first letters that occur in the list.
      required:
        - letters
        - totalCount
      properties:
        letters:
          type: array
          description: >-
            Letters in list order ("#" first when ascending); letters without items are
            left out.
          maxItems: 27
          items:
            $ref: "#/components/schemas/LetterOffset"
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of items in the sorted, filtered list.
          example: 42
    LibraryFolderEntryKind:
      type: string
      description: >-
        What a folder entry is: "folder" (open it with its path) or "item" (a catalog item
        found in the folder). Clients must tolerate values added in later versions.
      enum:
        - folder
        - item
      example: folder
    LibraryFolderEntry:
      type: object
      description: One child of a library folder.
      required:
        - kind
        - name
        - path
      properties:
        kind:
          $ref: "#/components/schemas/LibraryFolderEntryKind"
        name:
          type: string
          description: >-
            Name of the folder, or file or folder name of the item; at the top the last
            segment of the library folder.
          example: Animation
        path:
          type: string
          description: >-
            Path relative to the library, separated by "/"; pass a folder's path to
            listLibraryFolders. Never an absolute server path.
          example: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d/Animation
        item:
          $ref: "#/components/schemas/ItemSummary"
    LibraryFolderListing:
      type: object
      description: One page of the children of a library folder.
      required:
        - libraryId
        - path
        - entries
      properties:
        libraryId:
          type: string
          format: uuid
          description: ID of the library.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        path:
          type: string
          description: The listed folder relative to the library; empty for the top.
          example: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d/Animation
        parentPath:
          type: string
          nullable: true
          description: The parent folder relative to the library; null at the top.
          example: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
        entries:
          type: array
          description: >-
            Sub-folders first, then items, each group ordered by name. An entry of kind
            "item" carries item; folders carry none.
          items:
            $ref: "#/components/schemas/LibraryFolderEntry"
        nextCursor:
          type: string
          maxLength: 2048
          description: >-
            Opaque cursor for the next page; omitted on the last page. Pass it unchanged as
            the cursor query parameter.
          example: eyJuIjoiQW5pbWF0aW9uIn0
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of entries of the folder across all pages.
          example: 3
    RowKind:
      type: string
      description: >-
        What a row shows: "recentlyAdded" (newest items of a library by dateAdded; episodes
        are grouped into show or season cards, see Row), "newReleases" (newest movies or
        shows by release or first air date), "moreGenre" (items of one genre, named in
        Row.genre) or "recentEpisodes" (episodes by air date, newest first, in shows
        libraries). Later milestones add kinds such as "people", "topRated",
        "continueWatching" and "upNext". Clients must tolerate values added in later
        versions; a client that does not know a kind still renders the row from titleKey,
        cardFormat and items.
      enum:
        - recentlyAdded
        - newReleases
        - moreGenre
        - recentEpisodes
      example: recentlyAdded
    CardFormat:
      type: string
      description: >-
        Card shape of a row (HO-02): "poster" (2:3, the item's poster), "episode" (16:9,
        the item's thumb, falling back to its poster) or "square" (1:1, albums and photos).
        Clients must tolerate values added in later versions and render unknown formats as
        "poster".
      enum:
        - poster
        - episode
        - square
      example: poster
    RowsHint:
      type: string
      description: >-
        Why a rows response has no or few rows, for a short hint instead of an empty page:
        "noLibraries" (Home without libraries; the client offers "Add library", HO-09),
        "noItems" (the library, or every library on Home, has no items yet), "scanning"
        (no items yet and the first scan is running) or "notEnoughData" (items exist but
        lack the metadata most rows need, for example release dates or genres; it may
        accompany the rows that could be built). Clients must tolerate values added in
        later versions and show a generic hint for unknown values.
      enum:
        - noLibraries
        - noItems
        - scanning
        - notEnoughData
      example: noItems
    BrowseQuery:
      type: object
      description: >-
        The sort and filters of a Browse pivot listing (listLibraryItems) as a structured
        object: every property has the name, values and bounds of the listLibraryItems
        query parameter of the same name, and an absent property means that parameter's
        default. "See all" opens the Browse pivot of Row.libraryId with these values in the
        URL. The Browse pivot lists top-level items, so a row of episodes points to their
        shows.
      properties:
        matchState:
          $ref: "#/components/schemas/MatchState"
        sort:
          $ref: "#/components/schemas/ItemSort"
        order:
          $ref: "#/components/schemas/SortOrder"
        seed:
          type: integer
          format: int32
          minimum: 0
          description: Seed of sort "random", as the listLibraryItems parameter seed.
        type:
          $ref: "#/components/schemas/ItemKind"
        quick:
          $ref: "#/components/schemas/ItemQuickFilter"
        genre:
          type: array
          maxItems: 50
          description: Genres, as the listLibraryItems parameter genre.
          items:
            type: string
            minLength: 1
            maxLength: 200
            description: One genre.
        year:
          type: array
          maxItems: 50
          description: Years, as the listLibraryItems parameter year.
          items:
            type: integer
            format: int32
            minimum: 1000
            maximum: 9999
            description: One year.
        decade:
          type: array
          maxItems: 50
          description: Decades by their first year, as the listLibraryItems parameter decade.
          items:
            type: integer
            format: int32
            minimum: 1000
            maximum: 9990
            multipleOf: 10
            description: First year of one decade.
        contentRating:
          type: array
          maxItems: 50
          description: Content ratings, as the listLibraryItems parameter contentRating.
          items:
            type: string
            minLength: 1
            maxLength: 100
            description: One content rating.
        resolution:
          type: array
          maxItems: 10
          description: Resolution classes, as the listLibraryItems parameter resolution.
          items:
            $ref: "#/components/schemas/VideoResolution"
        videoCodec:
          type: array
          maxItems: 50
          description: Video codecs, as the listLibraryItems parameter videoCodec.
          items:
            type: string
            minLength: 1
            maxLength: 64
            description: One video codec identifier.
        audioCodec:
          type: array
          maxItems: 50
          description: Audio codecs, as the listLibraryItems parameter audioCodec.
          items:
            type: string
            minLength: 1
            maxLength: 64
            description: One audio codec identifier.
        container:
          type: array
          maxItems: 50
          description: Containers, as the listLibraryItems parameter container.
          items:
            type: string
            minLength: 1
            maxLength: 64
            description: One container.
        audioLanguage:
          type: array
          maxItems: 50
          description: Audio languages, as the listLibraryItems parameter audioLanguage.
          items:
            type: string
            minLength: 1
            maxLength: 35
            description: One language.
        subtitleLanguage:
          type: array
          maxItems: 50
          description: Subtitle languages, as the listLibraryItems parameter subtitleLanguage.
          items:
            type: string
            minLength: 1
            maxLength: 35
            description: One language.
    Row:
      type: object
      description: >-
        One row of Home or of a library's Overview pivot with its first items (HO-07). The
        title is a translation key with parameters, never a translated text: the server has
        no UI language. Episode grouping in "recentlyAdded" (HO-05): the recently added
        episodes of one show become one card; when they all belong to one season the card
        is that season, else the show, and newEpisodeCount counts them. In "recentEpisodes"
        every card is an episode with seasonNumber, showTitle and its show's poster in
        poster. "moreGenre" rows rotate daily: the server ranks the library's genres by
        number of items and picks up to three of the top ten, seeded by the server's local
        calendar date as the number YYYYMMDD, so every client sees the same genres for the
        whole day.
      required:
        - id
        - kind
        - titleKey
        - cardFormat
        - items
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
          pattern: "^[A-Za-z0-9:._-]+$"
          description: >-
            Opaque identifier of the row, stable across requests (for list keys and later
            for hiding a row, HO-08). Not a UUID; clients must not parse it.
          example: recentlyAdded:3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        kind:
          $ref: "#/components/schemas/RowKind"
        titleKey:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z][A-Za-z0-9]*(\\.[a-z][A-Za-z0-9]*)*$"
          description: >-
            Translation key of the row title: "rows.recentlyAdded", "rows.recentlyAddedIn"
            (Home, parameter library), "rows.newReleases", "rows.moreGenre" (parameter
            genre) or "rows.recentEpisodes"; later versions add keys. A client without a
            translation for the key falls back to a title for kind.
          example: rows.moreGenre
        titleParams:
          type: object
          maxProperties: 10
          description: >-
            Values of the title's placeholders by name, for example {"genre": "Comedy"} or
            {"library": "Movies"}; omitted when the title has none. Values are data (genre
            or library names), not translated text.
          additionalProperties:
            type: string
            maxLength: 200
            description: Value of one placeholder.
          example:
            genre: Comedy
        libraryId:
          type: string
          format: uuid
          description: >-
            ID of the library the row comes from; seeAllQuery applies to its Browse pivot.
            Omitted only for rows across libraries (later milestones).
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        genre:
          type: string
          maxLength: 200
          description: The genre of a "moreGenre" row; omitted for other kinds.
          example: Comedy
        cardFormat:
          $ref: "#/components/schemas/CardFormat"
        seeAllQuery:
          $ref: "#/components/schemas/BrowseQuery"
        items:
          type: array
          maxItems: 50
          description: >-
            The row's first items in display order, at most the requested limit: movies,
            shows, seasons (grouped episodes) or episodes, depending on kind.
          items:
            $ref: "#/components/schemas/ItemSummary"
    HeroItem:
      type: object
      description: >-
        One title of the Home hero (HO-01). Only items with a backdrop are listed. year,
        genres and media (duration and resolution of a movie's primary file; omitted for
        shows, which own no file) make up the meta line above the title.
      required:
        - itemId
        - libraryId
        - kind
        - title
        - backdrop
      properties:
        itemId:
          type: string
          format: uuid
          description: ID of the item, for "More info" (getItem) and "Play".
          example: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
        libraryId:
          type: string
          format: uuid
          description: ID of the library that contains the item.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          maxLength: 500
          description: Display title of the item.
          example: Big Buck Bunny
        year:
          type: integer
          format: int32
          description: >-
            Release year of a movie or an album, publication year of an audiobook or
            first-air year of a show.
          example: 2008
        summaryLine:
          type: string
          maxLength: 300
          description: >-
            Start of the item's summary, cut by the server at a word boundary to fit one
            line; omitted when the item has no summary.
          example: A large and lovable rabbit deals with three tiny bullies.
        backdrop:
          $ref: "#/components/schemas/ImageRef"
        logo:
          $ref: "#/components/schemas/ImageRef"
        genres:
          type: array
          maxItems: 3
          description: >-
            Up to three of the item's genres in metadata order, for the meta line; omitted
            when the item has none.
          items:
            type: string
            description: Name of a genre.
          example: [Animation, Comedy]
        media:
          $ref: "#/components/schemas/MediaSummary"
    HomeRows:
      type: object
      description: The rows and the hero list of the Home screen.
      required:
        - rows
        - hero
      properties:
        rows:
          type: array
          maxItems: 100
          description: The rows in display order; empty without libraries or items.
          items:
            $ref: "#/components/schemas/Row"
        hero:
          type: array
          maxItems: 5
          description: >-
            Up to five titles for the hero, most recently added first (later milestones put
            "continue watching" first); empty when no item has a backdrop, and then the
            client hides the hero.
          items:
            $ref: "#/components/schemas/HeroItem"
        hint:
          $ref: "#/components/schemas/RowsHint"
    LibraryRows:
      type: object
      description: The rows of a library's Overview pivot.
      required:
        - libraryId
        - rows
      properties:
        libraryId:
          type: string
          format: uuid
          description: ID of the library.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        rows:
          type: array
          maxItems: 100
          description: The rows in display order; empty for a library without items.
          items:
            $ref: "#/components/schemas/Row"
        hint:
          $ref: "#/components/schemas/RowsHint"
    ItemDetail:
      type: object
      description: >-
        An item with its local metadata, artwork, place in the hierarchy, extras, media
        files and their technical streams. Fields that do not apply to the item's kind, or
        that are unknown, are omitted. artwork holds one image per kind; a season without
        its own poster carries its show's poster, an audiobook carries its 2:3 cover in
        artwork.poster, an album and an artist carry their image in artwork.square, a photo
        carries itself and a photo album its newest "ready" photo in artwork.square
        (ImageRef.id is the photo's item ID, the image keeps the photo's aspect ratio).
        files is empty for containers (show, season, artist, album, photo album). chapters
        lists the chapters of an audiobook. photo and thumbnailState describe a photo: its
        EXIF block and whether the server can render it (ADR 0029). The lightbox reads the
        file name and size from files[0]; for a RAW+JPEG pair the JPEG is files[0] and the
        RAW an alternative file. A video in a photos library is a photo with media files
        and a playItemId, played through the normal playback path.
      required:
        - id
        - libraryId
        - kind
        - title
        - files
      properties:
        id:
          type: string
          format: uuid
          description: ID of the item.
          example: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
        libraryId:
          type: string
          format: uuid
          description: ID of the library that contains the item.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        kind:
          $ref: "#/components/schemas/ItemKind"
        title:
          type: string
          description: Display title from local metadata (NFO) or else the file or folder name.
          example: Big Buck Bunny
        number:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Season number of a season (0 for specials), episode number of an episode or
            track number of a track on its disc.
          example: 1
        numberEnd:
          type: integer
          format: int32
          minimum: 0
          description: Last episode number of a file that holds several episodes (S01E01-E02).
          example: 2
        discNumber:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Disc number of a track on its album, from the disc tag (ADR 0027); omitted when
            unknown and for other kinds.
          example: 2
        originalTitle:
          type: string
          description: Title in the original language when it differs from the title.
          example: Big Buck Bunny
        year:
          type: integer
          format: int32
          description: >-
            Release year of a movie or an album, publication year of an audiobook or
            first-air year of a show.
          example: 2008
        releaseDate:
          type: string
          format: date
          description: Release date of a movie or air date of an episode (YYYY-MM-DD).
          example: "2008-05-20"
        summary:
          type: string
          description: Plot summary as plain text.
          example: A giant rabbit takes revenge on three bullying rodents.
        tagline:
          type: string
          description: Tagline of a movie or show.
          example: The story of a giant bunny.
        contentRating:
          type: string
          description: >-
            Age rating as stored in the metadata, for example "FSK 12" or "PG-13"; not
            normalised by country.
          example: FSK 6
        genres:
          type: array
          description: Genres in metadata order.
          items:
            type: string
            description: Name of a genre.
          example: [Animation, Comedy]
        studios:
          type: array
          description: Studios or networks in metadata order.
          items:
            type: string
            description: Name of a studio or network.
          example: [Blender Foundation]
        countries:
          type: array
          description: Production countries in metadata order.
          items:
            type: string
            description: Name of a country as stored in the metadata.
          example: [Netherlands]
        people:
          type: array
          description: Credited people in metadata order (cast first by billing order).
          items:
            $ref: "#/components/schemas/ItemPerson"
        providerIds:
          $ref: "#/components/schemas/ProviderIds"
        artwork:
          $ref: "#/components/schemas/Artwork"
        ancestors:
          type: array
          description: >-
            The items above this one, root first (the show of a season; the show and the
            season of an episode; the movie or show of an extra; the nested photo albums
            of a photo, as in the folder breadcrumb); empty or omitted for top-level items.
          items:
            $ref: "#/components/schemas/ItemAncestor"
        previousId:
          type: string
          format: uuid
          description: >-
            ID of the previous sibling of a season or episode in ascending order; omitted
            for the first one and for other kinds.
          example: 6d7e8f9a-0b1c-4d2e-8f3a-4b5c6d7e8f9a
        nextId:
          type: string
          format: uuid
          description: >-
            ID of the next sibling of a season or episode in ascending order; omitted for
            the last one and for other kinds.
          example: 9a0b1c2d-3e4f-4a5b-9c6d-7e8f9a0b1c2d
        playItemId:
          type: string
          format: uuid
          description: >-
            ID of the item Play starts: the item itself for a movie, episode, extra, track
            or audiobook and for a photo that is a video; the first episode of the first
            regular season for a show; the first episode for a season. Omitted when there
            is nothing to play (for example a still photo or a photo album).
          example: 8a9b0c1d-2e3f-4a5b-8c6d-7e8f9a0b1c2d
        extras:
          type: array
          description: Extras of a movie or show, ordered by type and title.
          maxItems: 100
          items:
            $ref: "#/components/schemas/ItemSummary"
        childCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Number of seasons of a show, of episodes of a season, of albums of an artist, of
            tracks of an album or of the direct children (sub-albums and photos) of a photo
            album.
          example: 5
        leafCount:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Number of episodes of a show across all its seasons, of tracks of an artist
            across all its albums or of photos of a photo album including its sub-albums
            (the "n photos" line of an album card).
          example: 62
        files:
          type: array
          description: >-
            Media files of the item; the first one is the primary file. Several files are
            alternative versions (versionLabel) or parts of one version (partNumber); a
            photo holds its image (for a RAW+JPEG pair the JPEG first, the RAW second);
            shows, seasons, artists, albums and photo albums have none.
          items:
            $ref: "#/components/schemas/MediaFile"
        chapters:
          type: array
          maxItems: 2000
          description: >-
            Chapters of an audiobook in playback order, from the chapter markers of its
            files or one chapter per part file (ADR 0027); omitted for other kinds and when
            the book has no chapters.
          items:
            $ref: "#/components/schemas/ItemChapter"
        photo:
          $ref: "#/components/schemas/ItemPhoto"
        thumbnailState:
          $ref: "#/components/schemas/ThumbnailState"
        matchState:
          $ref: "#/components/schemas/MatchState"
        metadataSources:
          $ref: "#/components/schemas/MetadataSources"
    ItemPhoto:
      type: object
      description: >-
        Capture data of a photo for the lightbox info panel, read from its EXIF block (ADR
        0029); present for photos only. Every field except takenAt and takenAtSource is
        omitted when the file does not carry it. latitude and longitude are present
        together or not at all. Privacy: until accounts exist (milestone 7) the GPS
        position is visible to every admitted client; a server setting or a later
        permission may omit it, so clients must expect it to be missing. It is never part
        of a signed or share URL.
      required:
        - takenAt
        - takenAtSource
      properties:
        takenAt:
          type: string
          format: date-time
          description: >-
            Capture time: the EXIF capture time (DateTimeOriginal), or the file's
            modification time when the file has none (takenAtSource "file"). EXIF times
            carry no time zone and OffsetTimeOriginal is not applied, so the value is the
            camera's wall-clock reading sent with offset Z; the modification time is
            likewise the server's local wall-clock reading sent with offset Z, so both
            order alike. Clients display and group it as UTC and never convert it to the
            viewer's time zone.
          example: "2026-10-12T14:35:08Z"
        takenAtSource:
          $ref: "#/components/schemas/PhotoTimeSource"
        make:
          type: string
          maxLength: 200
          description: Camera manufacturer (EXIF Make).
          example: Alpha
        model:
          type: string
          maxLength: 200
          description: Camera model (EXIF Model).
          example: Alpha Q2
        lens:
          type: string
          maxLength: 200
          description: Lens model (EXIF LensModel).
          example: 35 mm f/1.8
        exposureTime:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: >-
            Exposure time in seconds; the client formats it, for example 0.004 as "1/250 s".
          example: 0.004
        fNumber:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Aperture as an f-number, shown as "f/1.8".
          example: 1.8
        iso:
          type: integer
          format: int32
          minimum: 1
          description: ISO speed rating.
          example: 200
        focalLengthMm:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Focal length in millimetres.
          example: 35
        orientation:
          type: integer
          format: int32
          minimum: 1
          maximum: 8
          description: >-
            EXIF orientation (1 upright, 5-8 turned by a quarter). Informational: thumbnails
            and the lightbox image are already served upright.
          example: 1
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: >-
            GPS latitude in decimal degrees (north positive). Visible to every admitted
            client until accounts exist; may be omitted by a server setting or a later
            permission; never in a signed or share URL.
          example: 54.0924
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: >-
            GPS longitude in decimal degrees (east positive). Visible to every admitted
            client until accounts exist; may be omitted by a server setting or a later
            permission; never in a signed or share URL.
          example: 12.1407
        width:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Width in pixels as displayed, with the orientation applied (a quarter turn
            swaps the stored width and height); with height it gives the aspect ratio the
            lightbox reserves before the image loads.
          example: 6000
        height:
          type: integer
          format: int32
          minimum: 1
          description: Height in pixels as displayed, with the orientation applied.
          example: 4000
    PhotoTimeSource:
      type: string
      description: >-
        Where ItemPhoto.takenAt comes from: "exif" (the capture time in the file) or "file"
        (the file's modification time, because the file carries none). The timeline shows
        both by takenAt; a client may mark "file" times as uncertain. Clients must tolerate
        values added in later versions.
      enum:
        - exif
        - file
      example: exif
    ThumbnailState:
      type: string
      description: >-
        Whether the server can render a photo (ADR 0029); present for photos only.
        Thumbnails are rendered on demand, so "ready" means getImage is expected to serve
        it, from the file itself or from the embedded preview of a RAW or HEIC file;
        "unsupported" means the server knows that neither the file nor an embedded preview
        can be decoded (the photo stays listed, it has no image reference, getImage answers
        422 and the client shows a placeholder). Clients must tolerate values added in
        later versions.
      enum:
        - ready
        - unsupported
      example: ready
    ItemChapter:
      type: object
      description: >-
        One chapter of an audiobook. startMs and endMs are offsets in milliseconds within
        the media file fileId (one of ItemDetail.files), so a client jumps to the chapter by
        playing that file from startMs.
      required:
        - title
        - startMs
        - endMs
        - fileId
      properties:
        title:
          type: string
          maxLength: 500
          description: Title of the chapter; a numbered fallback when the file names none.
          example: Chapter 1
        startMs:
          type: integer
          format: int64
          minimum: 0
          description: Start of the chapter in its file, in milliseconds.
          example: 0
        endMs:
          type: integer
          format: int64
          minimum: 0
          description: End of the chapter in its file, in milliseconds; greater than startMs.
          example: 1843250
        fileId:
          type: string
          format: uuid
          description: ID of the media file (MediaFile.id) that holds the chapter.
          example: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
    MediaFile:
      type: object
      description: >-
        One media file and what probing found in it. The API never exposes file system
        paths; files are addressed by ID only.
      required:
        - id
        - fileName
        - sizeBytes
        - modifiedAt
        - available
        - streams
      properties:
        id:
          type: string
          format: uuid
          description: ID of the file; PlaybackRequest.fileId refers to it.
          example: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        fileName:
          type: string
          description: >-
            Name of the file without any directory, for example "movie.mkv". A forward
            slash and a backslash both count as a directory separator. A DVD or Blu-ray
            folder is named after the folder that holds VIDEO_TS or BDMV, for example
            "Heat (1995)".
          example: Big.Buck.Bunny.mkv
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: File size in bytes.
          example: 276134947
        modifiedAt:
          type: string
          format: date-time
          description: Last modification time of the file (UTC).
          example: "2026-10-01T09:30:00Z"
        available:
          type: boolean
          description: Whether the file was probed successfully and can be played.
          example: true
        errorCode:
          type: string
          description: >-
            Machine-readable reason the file cannot be played; omitted when available.
            Known codes: "probe_failed" (the file could not be read), "probe_timed_out"
            (reading the file took too long), "disc_encrypted" (the main title of the disc
            is copy protected), "disc_unsupported" (the disc cannot be read) and
            "disc_no_title" (the disc has no playable title). Clients show a generic text
            for unknown codes.
          example: probe_failed
        container:
          type: string
          description: Container short name (ADR 0023), for example "mkv"; omitted when unknown.
          example: mkv
        durationSeconds:
          type: number
          format: double
          minimum: 0
          description: Duration in seconds with millisecond precision; omitted when unknown.
          example: 5423.042
        bitRate:
          type: integer
          format: int64
          minimum: 0
          description: Overall bit rate in bits per second; omitted when unknown.
          example: 4073000
        versionLabel:
          type: string
          description: >-
            Label of the version this file belongs to, from the file name (for example "4K"
            or "Director's Cut"); omitted for the only or unlabelled version.
          example: Director's Cut
        partNumber:
          type: integer
          format: int32
          minimum: 1
          description: >-
            Number of the part (cd1, part2, …) when a version is split into several files;
            omitted for a file that is a whole version.
          example: 1
        streams:
          type: array
          description: Streams in container order; empty when probing failed.
          items:
            $ref: "#/components/schemas/MediaStream"
    MediaStreamKind:
      type: string
      description: >-
        Kind of a stream inside a media file. Clients must tolerate values added in later
        versions.
      enum:
        - video
        - audio
        - subtitle
        - other
      example: video
    MediaStream:
      type: object
      description: >-
        One stream of a media file as ffprobe reports it. Fields that do not apply to the
        stream's kind, or that ffprobe did not report, are omitted.
      required:
        - index
        - kind
        - default
        - forced
        - attachedPicture
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
          description: Index of the stream in the container; PlaybackRequest.audioStreamIndex refers to it.
          example: 1
        kind:
          $ref: "#/components/schemas/MediaStreamKind"
        codec:
          type: string
          description: ffprobe codec_name, for example "h264", "hevc", "aac" or "subrip".
          example: h264
        profile:
          type: string
          description: Codec profile as ffprobe names it, for example "High" or "Main 10".
          example: High
        level:
          type: integer
          format: int32
          description: Codec level as ffprobe reports it, for example 41 for H.264 level 4.1.
          example: 41
        bitDepth:
          type: integer
          format: int32
          minimum: 0
          description: Bits per sample of a video stream.
          example: 8
        width:
          type: integer
          format: int32
          minimum: 0
          description: Width of a video stream in pixels.
          example: 1920
        height:
          type: integer
          format: int32
          minimum: 0
          description: Height of a video stream in pixels.
          example: 1080
        frameRate:
          type: number
          format: double
          minimum: 0
          description: Frames per second of a video stream.
          example: 23.976
        hdr:
          $ref: "#/components/schemas/HdrFormat"
        channels:
          type: integer
          format: int32
          minimum: 0
          description: Number of channels of an audio stream.
          example: 6
        channelLayout:
          type: string
          description: Channel layout of an audio stream, for example "5.1(side)".
          example: 5.1(side)
        sampleRate:
          type: integer
          format: int32
          minimum: 0
          description: Sample rate of an audio stream in Hz.
          example: 48000
        language:
          type: string
          description: Language tag of the stream as stored in the file, usually ISO 639-2.
          example: eng
        title:
          type: string
          description: Title of the stream as stored in the file.
          example: Director's commentary
        default:
          type: boolean
          description: Whether the stream carries the default disposition.
          example: true
        forced:
          type: boolean
          description: Whether the stream carries the forced disposition.
          example: false
        attachedPicture:
          type: boolean
          description: Whether the stream is cover art (attached picture), not a video track.
          example: false
        bitRate:
          type: integer
          format: int64
          minimum: 0
          description: Bit rate of the stream in bits per second.
          example: 3500000
    MediaIdentifier:
      type: string
      description: >-
        Lower-case identifier of a container (ADR 0023 direct-play key, for example "mp4")
        or a codec (ffprobe codec_name, for example "h264" or "pcm_s16le").
      pattern: "^[a-z0-9][a-z0-9_.-]{0,31}$"
      maxLength: 32
      example: h264
    DirectPlayProfile:
      type: object
      description: A container the client plays as a progressive file, with the codecs it plays inside it.
      required:
        - container
        - videoCodecs
        - audioCodecs
      properties:
        container:
          $ref: "#/components/schemas/MediaIdentifier"
        videoCodecs:
          type: array
          description: Video codecs the client plays in this container.
          maxItems: 32
          items:
            $ref: "#/components/schemas/MediaIdentifier"
          example: [h264, av1, vp9]
        audioCodecs:
          type: array
          description: Audio codecs the client plays in this container.
          maxItems: 32
          items:
            $ref: "#/components/schemas/MediaIdentifier"
          example: [aac, mp3, opus, flac]
    HlsDelivery:
      type: string
      description: >-
        How the client plays HLS with fMP4 segments: "mse" (a script player over Media
        Source Extensions, for example hls.js), "native" (the media element plays HLS
        itself) or "none" (no HLS; only direct play is possible). Clients must tolerate
        values added in later versions.
      enum:
        - mse
        - native
        - none
      example: mse
    HlsProfile:
      type: object
      description: Codecs the client plays inside HLS with fMP4 segments.
      required:
        - delivery
        - videoCodecs
        - audioCodecs
      properties:
        delivery:
          $ref: "#/components/schemas/HlsDelivery"
        videoCodecs:
          type: array
          description: Video codecs the client plays inside HLS.
          maxItems: 32
          items:
            $ref: "#/components/schemas/MediaIdentifier"
          example: [h264, av1, vp9]
        audioCodecs:
          type: array
          description: Audio codecs the client plays inside HLS.
          maxItems: 32
          items:
            $ref: "#/components/schemas/MediaIdentifier"
          example: [aac, mp3, opus, flac]
    CodecLimit:
      type: object
      description: >-
        Extra limits of the client for one codec; a codec without an entry has none.
      required:
        - codec
      properties:
        codec:
          $ref: "#/components/schemas/MediaIdentifier"
        maxBitDepth:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
          description: Highest bit depth the client decodes for this codec; omitted when unlimited.
          example: 8
        profiles:
          type: array
          description: >-
            Codec profiles the client decodes, as ffprobe names them; omitted when every
            profile plays.
          maxItems: 16
          items:
            type: string
            description: Profile name as ffprobe reports it, for example "Main".
            maxLength: 64
          example: [Constrained Baseline, Baseline, Main, High]
    ClientProfile:
      type: object
      description: >-
        What a client plays (ADR 0023). Browsers fill it from canPlayType,
        MediaSource.isTypeSupported and mediaCapabilities; arrays are bounded.
      required:
        - name
        - directPlay
        - hls
      properties:
        name:
          type: string
          description: Free text naming the client, for logs and the stream-info overlay.
          maxLength: 64
          example: chromium-desktop
        directPlay:
          type: array
          description: Containers the client plays as a progressive file.
          maxItems: 16
          items:
            $ref: "#/components/schemas/DirectPlayProfile"
        hls:
          $ref: "#/components/schemas/HlsProfile"
        codecLimits:
          type: array
          description: Per-codec limits; omitted or empty when no codec has extra limits.
          maxItems: 32
          items:
            $ref: "#/components/schemas/CodecLimit"
    PlaybackRequest:
      type: object
      description: Asks the server to play one media file for a client.
      required:
        - fileId
        - profile
      properties:
        fileId:
          type: string
          format: uuid
          description: ID of the media file (MediaFile.id).
          example: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        profile:
          $ref: "#/components/schemas/ClientProfile"
        startPositionSeconds:
          type: number
          format: double
          minimum: 0
          description: >-
            Position to start at, in seconds; omitted or 0 starts at the beginning. A
            position at or beyond the duration of the file answers 400 "invalid".
          example: 600
        audioStreamIndex:
          type: integer
          format: int32
          minimum: 0
          description: >-
            Index of the audio stream to play (MediaStream.index); omitted selects the
            default audio stream.
          example: 1
        replacesSessionId:
          type: string
          format: uuid
          description: >-
            Session this one replaces, for example after a seek outside the produced range.
            It is stopped before the session limit is checked; an unknown ID is ignored.
          example: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
    PlaybackMode:
      type: string
      description: >-
        How the file is played, from cheapest to most expensive: "direct_play" (the original
        file), "remux" (streams copied into HLS with fMP4 segments) or "transcode" (at least
        one stream re-encoded). Clients must tolerate values added in later versions.
      enum:
        - direct_play
        - remux
        - transcode
      example: remux
    PlaybackDelivery:
      type: string
      description: >-
        How the client loads streamUrl: "file" (a progressive file with range support) or
        "hls" (an HLS playlist). Clients must tolerate values added in later versions.
      enum:
        - file
        - hls
      example: hls
    PlaybackSessionState:
      type: string
      description: >-
        Lifecycle of a session: "starting" (FFmpeg has not produced the first segment yet),
        "ready" (the stream can be loaded), "ended" (production finished or the session was
        stopped) or "failed" (see failureCode). Direct-play sessions start as "ready".
        Clients must tolerate values added in later versions.
      enum:
        - starting
        - ready
        - ended
        - failed
      example: ready
    StreamAction:
      type: string
      description: >-
        What happens to one source stream: "copy" (passed through unchanged) or "transcode"
        (re-encoded). Clients must tolerate values added in later versions.
      enum:
        - copy
        - transcode
      example: copy
    StreamDecision:
      type: object
      description: What the session does with one selected source stream.
      required:
        - kind
        - sourceIndex
        - action
        - sourceCodec
        - targetCodec
      properties:
        kind:
          $ref: "#/components/schemas/MediaStreamKind"
        sourceIndex:
          type: integer
          format: int32
          minimum: 0
          description: Index of the source stream (MediaStream.index).
          example: 0
        action:
          $ref: "#/components/schemas/StreamAction"
        sourceCodec:
          type: string
          description: Codec of the source stream (ffprobe codec_name).
          example: hevc
        targetCodec:
          type: string
          description: Codec the client receives; equals sourceCodec when copied.
          example: h264
        targetWidth:
          type: integer
          format: int32
          minimum: 0
          description: Width of a video stream the client receives, in pixels.
          example: 1920
        targetHeight:
          type: integer
          format: int32
          minimum: 0
          description: Height of a video stream the client receives, in pixels.
          example: 1080
        targetChannels:
          type: integer
          format: int32
          minimum: 0
          description: Channels of an audio stream the client receives.
          example: 2
        encoder:
          type: string
          description: FFmpeg encoder of a transcoded stream, for example "libx264"; omitted when copied.
          example: libx264
    PlaybackReasonScope:
      type: string
      description: >-
        Part of the file a reason or warning concerns. Clients must tolerate values added in
        later versions.
      enum:
        - container
        - video
        - audio
        - subtitle
      example: audio
    PlaybackReason:
      type: object
      description: >-
        A machine-readable reason why a cheaper mode was not possible, or a warning about a
        degraded result (ADR 0023). Clients translate the code and show a generic text for
        unknown codes.
      required:
        - code
        - scope
      properties:
        code:
          type: string
          description: >-
            Reasons: "container_not_supported", "video_codec_not_supported",
            "video_profile_not_supported", "video_bit_depth_not_supported",
            "audio_codec_not_supported", "audio_channels_not_supported" (more than 5.1
            channels), "audio_track_not_first" (the selected audio track is not the first one,
            which browsers play from the original file), "disc_source" (a DVD or Blu-ray disc is
            never played directly). Warnings:
            "hdr_not_tone_mapped", "subtitles_not_supported", "video_downscaled". New codes
            may be added within API v1.
          example: audio_codec_not_supported
        scope:
          $ref: "#/components/schemas/PlaybackReasonScope"
    PlaybackSession:
      type: object
      description: >-
        A running or finished playback of one media file for one client, with the decision
        the server made and the URL to load.
      required:
        - id
        - fileId
        - state
        - mode
        - delivery
        - streamUrl
        - startPositionSeconds
        - sourceContainer
        - targetContainer
        - streams
        - reasons
        - warnings
      properties:
        id:
          type: string
          format: uuid
          description: ID of the session.
          example: 5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a
        fileId:
          type: string
          format: uuid
          description: ID of the media file being played.
          example: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
        state:
          $ref: "#/components/schemas/PlaybackSessionState"
        failureCode:
          type: string
          description: >-
            Machine-readable reason a session failed, for example "transcode_failed";
            omitted unless state is "failed". Clients show a generic text for unknown codes.
          example: transcode_failed
        mode:
          $ref: "#/components/schemas/PlaybackMode"
        delivery:
          $ref: "#/components/schemas/PlaybackDelivery"
        streamUrl:
          type: string
          format: uri-reference
          description: >-
            URI reference the client loads, as a file (delivery "file") or as an HLS
            playlist (delivery "hls"). Resolve it per RFC 3986 section 5 against the URL of
            the request that returned it. Clients must treat it as opaque: never parse,
            build or modify it, and never take IDs or other values out of it, because its
            shape may change (for example signed, time-limited URLs once accounts exist).
          example: /api/v1/playback/sessions/5d4c3b2a-1f0e-4d9c-8b7a-6f5e4d3c2b1a/hls/index.m3u8
        startPositionSeconds:
          type: number
          format: double
          minimum: 0
          description: >-
            Position in the file where the stream actually starts, in seconds. When video
            is copied it is the keyframe at or before the requested position. The player
            shows startPositionSeconds plus the media element's current time.
          example: 598.5
        durationSeconds:
          type: number
          format: double
          minimum: 0
          description: Probed duration of the whole file in seconds; omitted when unknown.
          example: 5423.042
        sourceContainer:
          type: string
          description: Container short name of the source file, for example "mkv".
          example: mkv
        targetContainer:
          type: string
          description: >-
            Container the client receives: the source container for direct play, "mp4"
            (fMP4 segments) for HLS.
          example: mp4
        sourceBitRate:
          type: integer
          format: int64
          minimum: 0
          description: Overall bit rate of the source file in bits per second; omitted when unknown.
          example: 4073000
        streams:
          type: array
          description: One decision per selected source stream (video first, then audio).
          items:
            $ref: "#/components/schemas/StreamDecision"
        reasons:
          type: array
          description: Why a cheaper mode was not possible; empty for direct play.
          items:
            $ref: "#/components/schemas/PlaybackReason"
        warnings:
          type: array
          description: Degradations of the result, for example a downscaled video.
          items:
            $ref: "#/components/schemas/PlaybackReason"
    ImageBytes:
      type: string
      format: binary
      description: Raw bytes of a rendered image.
    MediaBytes:
      type: string
      format: binary
      description: Raw bytes of a media file or segment.
    Problem:
      type: object
      description: >-
        Problem details (RFC 9457) with a machine-readable code that clients translate.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          description: URI reference identifying the problem type; "about:blank" if none.
        title:
          type: string
          description: Short, human-readable English summary of the problem type.
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP status code of this occurrence.
        detail:
          type: string
          description: Human-readable English explanation of this occurrence.
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence of the problem.
        code:
          type: string
          description: >-
            Stable machine-readable error code that clients map to a translated message.
            Published codes: "bad_request" (400, the request could not be parsed),
            "invalid" (400, the input breaks a rule), "forbidden" (403), "not_found" (404,
            also for unknown routes), "method_not_allowed" (405), "conflict" (409),
            "payload_too_large" (413, the request body exceeds 64 KiB), "unsupported" (422,
            the server cannot handle this input, for example an unprobed file),
            "no_compatible_format" (422, the client plays no format the server can
            produce), "transcode_unavailable" (422, transcoding is needed but the server
            cannot encode), "internal_error" (500), "unavailable" (503, for example while
            the server shuts down), "session_limit_reached" (503, too many playback
            sessions; see Retry-After) and "stream_not_ready" (503, the stream has no
            segment yet; see Retry-After). Library management adds "folder_not_found"
            (400), "folder_unreadable" (400), "folder_overlap" (409), "folder_reserved"
            (400), "folder_outside_roots" (400), "kind_unsupported" (400), "name_invalid"
            (400), "language_invalid" (400) and "too_many_folders" (400). Online metadata
            adds "online_disabled" (409, the feature is switched off) and
            "provider_unavailable" (503, the provider is offline or rate limiting; see
            retryAfterSeconds). "not_implemented" (501) answers an operation or a parameter
            value the contract declares but this server does not serve yet. New codes may be
            added; clients show a generic message for unknown codes.
          example: not_found
        field:
          type: string
          description: >-
            Request property the problem is about, for example "folders[1]"; omitted when
            it concerns no single property.
          example: folders[1]
        libraryId:
          type: string
          format: uuid
          description: >-
            For "folder_overlap", the library that already holds an overlapping folder;
            omitted when there is none.
          example: 3f6c1d2a-9b8e-4f70-8a1c-2d3e4f5a6b7c
        retryAfterSeconds:
          type: integer
          format: int32
          minimum: 1
          description: >-
            For "provider_unavailable", the seconds after which a retry may succeed (the
            Retry-After header carries the same value); omitted when unknown.
          example: 30
